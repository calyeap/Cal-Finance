name: Fire independent workflow verifier

# OUTCOME-ID: CB-VERIFIER-FIRE-01
#
# `needs-independent-verification` is a routing signal for the cross-project
# WORKFLOW-VERIFIER. The verifier is independent review only: this workflow
# does not verify, merge, sequence, dispatch project work, or change semantic
# state. First proof target: PR #111 / issue #112.
#
# Runtime secrets are intentionally not stored in source:
#   VERIFIER_FIRE_URL   -> WORKFLOW-VERIFIER API trigger URL
#   VERIFIER_FIRE_TOKEN -> WORKFLOW-VERIFIER API bearer token
#
# The label stays present for a grace period after the API returns so the
# asynchronously started verifier can identify the target from repository
# state even if trigger payload context is incomplete.
#
# CB-VERIFIER-FIRE-02: PR label routing uses pull_request_target so this
# workflow is loaded from the base/default branch. This matters for older
# open PRs whose head predates the introduction of this workflow. The job
# does not checkout or execute PR code.

on:
  issues:
    types: [labeled]
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  fire-verifier:
    if: github.event.label.name == 'needs-independent-verification'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve labelled item
        id: target
        shell: bash
        run: |
          NUMBER="${{ github.event.issue.number || github.event.pull_request.number }}"
          if [ -z "$NUMBER" ]; then
            echo "::error::Could not resolve labelled issue or pull request number."
            exit 1
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Fire WORKFLOW-VERIFIER API trigger
        id: fire
        shell: bash
        env:
          VERIFIER_FIRE_URL: ${{ secrets.VERIFIER_FIRE_URL }}
          VERIFIER_FIRE_TOKEN: ${{ secrets.VERIFIER_FIRE_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          TARGET_NUMBER: ${{ steps.target.outputs.number }}
        run: |
          set -uo pipefail

          if [ -z "${VERIFIER_FIRE_URL:-}" ] || [ -z "${VERIFIER_FIRE_TOKEN:-}" ]; then
            echo "::error::VERIFIER_FIRE_URL or VERIFIER_FIRE_TOKEN repository secret is missing."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "http_code=missing_secret" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PROMPT="Repository ${TARGET_REPO}, item #${TARGET_NUMBER} was labelled needs-independent-verification. Independently verify that target under the current WORKFLOW-VERIFIER procedure and post the durable verdict on the target."
          REQUEST_BODY=$(jq -n --arg text "$PROMPT" '{text: $text}')

          HTTP_CODE=$(curl -sS -o /tmp/verifier_fire_response.json -w '%{http_code}' \
            --request POST "$VERIFIER_FIRE_URL" \
            --header "Authorization: Bearer $VERIFIER_FIRE_TOKEN" \
            --header "anthropic-version: 2023-06-01" \
            --header "anthropic-beta: experimental-cc-routine-2026-04-01" \
            --header "Content-Type: application/json" \
            --data "$REQUEST_BODY") || HTTP_CODE="curl_error"

          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"

          if [ "$HTTP_CODE" != "curl_error" ] && [ "$HTTP_CODE" -ge 200 ] 2>/dev/null && [ "$HTTP_CODE" -lt 300 ] 2>/dev/null; then
            SESSION_ID=$(jq -r '.claude_code_session_id // "unknown"' /tmp/verifier_fire_response.json)
            SESSION_URL=$(jq -r '.claude_code_session_url // "unknown"' /tmp/verifier_fire_response.json)
            echo "session_id=$SESSION_ID" >> "$GITHUB_OUTPUT"
            echo "session_url=$SESSION_URL" >> "$GITHUB_OUTPUT"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report verifier fire
        if: steps.fire.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/${{ steps.target.outputs.number }}/comments" \
            -f body="CB-VERIFIER-FIRE-01: fired WORKFLOW-VERIFIER (HTTP ${{ steps.fire.outputs.http_code }}). session: ${{ steps.fire.outputs.session_id }} (${{ steps.fire.outputs.session_url }})"

      - name: Remove verifier label after grace period
        if: steps.fire.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 600
          gh api --method DELETE \
            "repos/${{ github.repository }}/issues/${{ steps.target.outputs.number }}/labels/needs-independent-verification"

      - name: Report verifier fire failure
        if: steps.fire.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFIER_FIRE_TOKEN: ${{ secrets.VERIFIER_FIRE_TOKEN }}
        run: |
          RAW_BODY=$(cat /tmp/verifier_fire_response.json 2>/dev/null || echo "(no response body — request may not have completed)")
          if [ -n "${VERIFIER_FIRE_TOKEN:-}" ]; then
            SAFE_BODY=$(printf '%s' "$RAW_BODY" | sed "s/${VERIFIER_FIRE_TOKEN}/[REDACTED]/g")
          else
            SAFE_BODY="$RAW_BODY"
          fi

          COMMENT_BODY=$(printf 'CB-VERIFIER-FIRE-01: WORKFLOW-VERIFIER fire failed (HTTP %s).\n\n```\n%s\n```' "${{ steps.fire.outputs.http_code }}" "$SAFE_BODY")
          gh api --method POST \
            "repos/${{ github.repository }}/issues/${{ steps.target.outputs.number }}/comments" \
            -f body="$COMMENT_BODY"

          echo "::error::WORKFLOW-VERIFIER fire failed with HTTP ${{ steps.fire.outputs.http_code }}"
          exit 1
