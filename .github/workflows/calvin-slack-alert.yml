name: Notify Calvin on actionable parent terminal

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  notify-calvin:
    if: >-
      contains(github.event.comment.body, 'CALVIN REQUIRED:') ||
      contains(github.event.comment.body, 'BLOCKED: ACTIONABLE') ||
      contains(github.event.comment.body, 'COMPLETE:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Classify first-line terminal
        id: terminal
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -uo pipefail
          source .github/scripts/runtime-lib.sh
          KIND="$(runtime_slack_kind "$COMMENT_BODY")"
          LINE="$(runtime_strip_heading "$(runtime_first_line "$COMMENT_BODY")")"
          LINE=$(printf '%s' "$LINE" | sed -E 's/[[:space:]]*\[OWNER_ATTEMPT_ID:[^]]+\][[:space:]]*$//')
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          {
            echo "line<<EOF"
            echo "$LINE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send Slack terminal
        if: steps.terminal.outputs.kind != 'none'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.CALVIN_SLACK_WEBHOOK_URL }}
          KIND: ${{ steps.terminal.outputs.kind }}
          LINE: ${{ steps.terminal.outputs.line }}
          REPO: ${{ github.repository }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::error::CALVIN_SLACK_WEBHOOK_URL is missing"
            exit 1
          fi
          case "$KIND" in
            calvin_required) HEADER="CALVIN REQUIRED" ;;
            actionable_blocked) HEADER="ACTIONABLE BLOCKED" ;;
            complete) HEADER="COMPLETE" ;;
            *) exit 0 ;;
          esac
          PAYLOAD=$(jq -n --arg h "$HEADER" --arg repo "$REPO" --arg line "$LINE" --arg url "$COMMENT_URL" \
            '{text: ($h + " — " + $repo + "\n" + $line + "\n" + $url)}')
          CODE=$(curl -sS -o /tmp/slack.txt -w '%{http_code}' --request POST "$SLACK_WEBHOOK_URL" \
            --header 'Content-Type: application/json' --data "$PAYLOAD")
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            echo "::error::Slack webhook failed with HTTP $CODE"
            exit 1
          fi
