name: Notify Calvin in Slack

# CF-CALVIN-ATTENTION-LEAN-01
#
# `CALVIN REQUIRED:` is the single attention truth. This used to fire only
# from a `needs-owner-wake` label event, then separately scan the target's
# comments for a matching latest terminal outcome. That made a genuine
# Calvin gate depend on two independent signals landing together: the
# `CALVIN REQUIRED:` comment itself, and a fresh `needs-owner-wake` label
# event alongside it. OWNER can post its own `CALVIN REQUIRED:` during
# terminal-wake reconciliation without that action re-labelling the
# target (labels never re-fire a workflow when written by the repo's own
# GITHUB_TOKEN — see cc-auto-fire.yml's fire-owner-on-terminal job for the
# same class of gap), so a real gate could go unalerted with nothing to
# reapply the label.
#
# Fixed by reacting directly to the comment event that carries the
# decision: `issue_comment: created` covers both a top-level issue comment
# and a top-level PR conversation comment. `needs-owner-wake` keeps its
# existing meaning for OWNER's own internal reconciliation mechanics
# (OWNER.md); this workflow no longer reads label events at all, so the
# same `CALVIN REQUIRED:` comment can never notify twice (once on the
# comment, again when something later applies the label).
# CF-TERMINAL-HANDOFF-REPAIR-01 (Part B: gate resolution semantics)
#
# Invariant, unchanged by this outcome, verified/preserved here: SLACK_SENT
# != GATE_RESOLVED. This workflow's only job is delivery-attempt evidence —
# sending, failing to send, or having no CALVIN_SLACK_WEBHOOK_URL configured
# at all never marks a CALVIN REQUIRED gate resolved. Gate resolution lives
# entirely in `.github/scripts/calvin-ruling-lib.sh`'s
# `calvin_ruling_gate_status`, which reads only GitHub comment state (a
# genuine `CALVIN RULING` admitted into cc-auto-fire.yml's
# fire-owner-on-terminal job) and has no awareness of this workflow, its
# HTTP status, or its secret at all. A gate stays live under Calvin's
# attention regardless of what happens here; only a typed Calvin ruling
# closes it (OWNER.md's Wake sources, "Ruling wake").
#
# CF-HANDOFF-FAIL-CLOSED-01
#
# Extends the same "react to the comment that carries the fact, not to a
# label" fix to the new WORKFLOW BLOCKED - AUTH / WORKFLOW BLOCKED -
# LIVENESS receipts (fire-auth-lib.sh, worker-liveness-guard.sh) and to the
# pre-existing OWNER LIVENESS EXHAUSTED - RECONCILIATION REQUIRED receipt
# (CF-OWNER-LIVENESS-01, left unrenamed for backward compatibility): each
# is a durable, once-only receipt on the target itself, so alerting off the
# comment event, exactly like CALVIN REQUIRED: already does, needs no new
# label and cannot double-notify for the same receipt. The same invariant
# from Part B still holds for these too: SLACK_SENT != GATE_RESOLVED /
# BLOCK_CLEARED - this workflow only attempts delivery, never decides
# anything on GitHub.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  notify-calvin:
    # Cheap prefilter only — mirrors cc-auto-fire.yml's fire-review job,
    # which gates the job on a substring `contains(...)` and leaves the
    # strict first-line contract to the step below. A comment that merely
    # mentions one of these markers later in its body (quoted, example,
    # prose) still reaches this job but is rejected inside "Resolve
    # terminal outcome" once the marker turns out not to be the first
    # non-blank line.
    if: >-
      contains(github.event.comment.body, 'CALVIN REQUIRED:') ||
      contains(github.event.comment.body, 'WORKFLOW BLOCKED') ||
      contains(github.event.comment.body, 'OWNER LIVENESS EXHAUSTED')
    runs-on: ubuntu-latest
    steps:
      # CF-CALVIN-ATTENTION-LEAN-01 correction: classify the marker through
      # the shared lib instead of a second hand-rolled copy of the
      # first-line pipeline, so a heading-prefixed "## CALVIN REQUIRED:"
      # first line still alerts (same reasoning as cc-auto-fire.yml's
      # fire-build job for the analogous CORRECT marker).
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve terminal outcome
        id: terminal
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -uo pipefail
          # shellcheck source=../scripts/terminal-routing-lib.sh
          source .github/scripts/terminal-routing-lib.sh

          if [ "$(terminal_is_calvin_required_marker "$COMMENT_BODY")" = "true" ]; then
            FIRST_LINE="$(terminal_first_line "$COMMENT_BODY")"
            NORMALIZED="$(terminal_strip_markdown_heading "$FIRST_LINE")"

            ASK=${NORMALIZED#CALVIN REQUIRED:}
            # CF-SLACK-ALERT-RELIABILITY-01: `xargs` parses its input for
            # shell-like quoting, so an apostrophe in an ordinary ask (e.g.
            # "Calvin's decision") produced an unmatched-quote failure here.
            # terminal_trim_whitespace trims via bash parameter expansion
            # only and treats quotes/backticks/brackets as opaque text.
            ASK=$(printf '%s' "$ASK" | sed -E 's/[[:space:]]*\[OWNER_ATTEMPT_ID:[^]]+\][[:space:]]*$//')
            ASK=$(terminal_trim_whitespace "$ASK")

            echo "kind=calvin_required" >> "$GITHUB_OUTPUT"
            echo "notify=true" >> "$GITHUB_OUTPUT"
            {
              echo "ask<<EOF"
              echo "$ASK"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          elif [ "$(terminal_is_workflow_blocked_marker "$COMMENT_BODY")" = "true" ]; then
            # CF-HANDOFF-FAIL-CLOSED-01: the WORKFLOW BLOCKED / OWNER
            # LIVENESS EXHAUSTED marker itself is already the headline
            # (e.g. "WORKFLOW BLOCKED — AUTH") — no need to extract an "ask"
            # suffix from it the way a CALVIN REQUIRED: line's own text is.
            ASK="$(terminal_first_line "$COMMENT_BODY")"

            echo "kind=blocked" >> "$GITHUB_OUTPUT"
            echo "notify=true" >> "$GITHUB_OUTPUT"
            {
              echo "ask<<EOF"
              echo "$ASK"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "notify=false" >> "$GITHUB_OUTPUT"
            echo "First non-empty line is neither CALVIN REQUIRED: nor a WORKFLOW BLOCKED / OWNER LIVENESS EXHAUSTED marker; no Slack alert."
            exit 0
          fi

      - name: Send Calvin Slack alert
        if: steps.terminal.outputs.notify == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.CALVIN_SLACK_WEBHOOK_URL }}
          KIND: ${{ steps.terminal.outputs.kind }}
          ASK: ${{ steps.terminal.outputs.ask }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          ITEM_URL: ${{ github.event.issue.html_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::error::CALVIN_SLACK_WEBHOOK_URL repository secret is missing."
            exit 1
          fi

          # CF-HANDOFF-FAIL-CLOSED-01: "blocked" (WORKFLOW BLOCKED — AUTH/
          # LIVENESS, or the pre-existing OWNER LIVENESS EXHAUSTED) uses its
          # own marker line as the headline, since it is already
          # self-describing; "calvin_required" keeps its existing header +
          # extracted-ask shape unchanged.
          PAYLOAD=$(jq -n \
            --arg kind "$KIND" \
            --arg repo "$REPO" \
            --arg ask "$ASK" \
            --arg item_url "$ITEM_URL" \
            --arg comment_url "$COMMENT_URL" \
            '{
              text: (
                (if $kind == "blocked" then
                  ($ask + " — " + $repo)
                else
                  ("CALVIN REQUIRED — " + $repo + "\n" + (if ($ask | length) > 0 then $ask else "Your decision is needed." end))
                end)
                + "\n" + (if ($comment_url | length) > 0 then $comment_url else $item_url end)
              )
            }')

          HTTP_CODE=$(curl -sS -o /tmp/slack_response.txt -w '%{http_code}' \
            --request POST "$SLACK_WEBHOOK_URL" \
            --header 'Content-Type: application/json' \
            --data "$PAYLOAD")

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Slack webhook failed with HTTP $HTTP_CODE"
            cat /tmp/slack_response.txt
            exit 1
          fi

          echo "Slack alert sent."
