name: Notify Calvin on actionable parent terminal

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

jobs:
  notify-calvin:
    if: >-
      contains(github.event.comment.body, 'CALVIN REQUIRED:') ||
      contains(github.event.comment.body, 'BLOCKED: ACTIONABLE') ||
      contains(github.event.comment.body, 'COMPLETE:') ||
      contains(github.event.comment.body, 'BLOCKED: AI') ||
      contains(github.event.comment.body, 'BLOCKED: EXTERNAL')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Classify first-line terminal
        id: terminal
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -uo pipefail
          source .github/scripts/runtime-lib.sh
          # runtime_slack_kind itself extracts the terminal line and, for
          # the OWNER-only `stopped` kind, needs the full raw body to find
          # an OWNER_ATTEMPT_ID tag that may live on a preceding metadata
          # line (runtime_terminal_tag_text) — pre-extracting here would
          # lose that tag. The job-level `if:` above is a cheap coarse
          # prefilter; this is the one precise classifier it must agree
          # with (CF-TERMINAL-NOTIFY-RELIABILITY-01, issue #408).
          KIND="$(runtime_slack_kind "$COMMENT_BODY")"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"

      # calvin-slack-notify.sh owns payload construction (including
      # stripping the internal OWNER_ATTEMPT_ID tag), duplicate detection
      # (CF-WORKFLOW-PROOF-SLACK-DEDUPE-01: an OWNER terminal that merely
      # restates an already-alerted child blocker, per the #365 class) and
      # the actual send, so this event-triggered path and every direct
      # in-job relay call (added for
      # CF-WORKFLOW-RESET-TERMINAL-HANDOFF-REPAIR-02, where a
      # workflow-authored comment cannot recursively reach this trigger)
      # share exactly one definition of what is Slack-eligible.
      - name: Send Slack terminal
        if: steps.terminal.outputs.kind != 'none'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.CALVIN_SLACK_WEBHOOK_URL }}
          SLACK_LINE: ${{ github.event.comment.body }}
          SLACK_REPO: ${{ github.repository }}
          SLACK_NUMBER: ${{ github.event.issue.number }}
          SLACK_COMMENT_URL: ${{ github.event.comment.html_url }}
          SLACK_CREATED_AT: ${{ github.event.comment.created_at }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::error::CALVIN_SLACK_WEBHOOK_URL is missing"
            exit 1
          fi
          source .github/scripts/calvin-slack-notify.sh
          # Prior comments on this same thread are what let
          # runtime_slack_is_duplicate (via calvin_slack_send) recognize an
          # OWNER terminal that only restates an already-alerted blocker,
          # instead of double-alerting Calvin for one underlying issue.
          # A failed fetch must never block the send: calvin_slack_payload
          # already treats an empty comments_json as "skip the duplicate
          # check", which is today's always-send behavior, so falling back
          # to "" here just means the dedupe check is skipped, not the alert.
          comments="$(gh api --paginate "repos/${SLACK_REPO}/issues/${SLACK_NUMBER}/comments" \
            --jq '[.[] | {body: .body, created_at: .created_at}]' | jq -s 'add // []')" || comments=""
          calvin_slack_send "$SLACK_LINE" "$SLACK_REPO" "$SLACK_COMMENT_URL" "$comments" "$SLACK_CREATED_AT"
