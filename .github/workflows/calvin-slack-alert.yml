name: Notify Calvin in Slack

# CF-CALVIN-ATTENTION-LEAN-01
#
# `CALVIN REQUIRED:` is the single attention truth. This used to fire only
# from a `needs-owner-wake` label event, then separately scan the target's
# comments for a matching latest terminal outcome. That made a genuine
# Calvin gate depend on two independent signals landing together: the
# `CALVIN REQUIRED:` comment itself, and a fresh `needs-owner-wake` label
# event alongside it. OWNER can post its own `CALVIN REQUIRED:` during
# terminal-wake reconciliation without that action re-labelling the
# target (labels never re-fire a workflow when written by the repo's own
# GITHUB_TOKEN — see cc-auto-fire.yml's fire-owner-on-terminal job for the
# same class of gap), so a real gate could go unalerted with nothing to
# reapply the label.
#
# Fixed by reacting directly to the comment event that carries the
# decision: `issue_comment: created` covers both a top-level issue comment
# and a top-level PR conversation comment. `needs-owner-wake` keeps its
# existing meaning for OWNER's own internal reconciliation mechanics
# (OWNER.md); this workflow no longer reads label events at all, so the
# same `CALVIN REQUIRED:` comment can never notify twice (once on the
# comment, again when something later applies the label).
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  notify-calvin:
    # Cheap prefilter only — mirrors cc-auto-fire.yml's fire-review job,
    # which gates the job on a substring `contains(...)` and leaves the
    # strict first-line contract to the step below. A comment that merely
    # mentions CALVIN REQUIRED: later in its body (quoted, example, prose)
    # still reaches this job but is rejected inside "Resolve terminal
    # outcome" once the marker turns out not to be the first non-blank
    # line.
    if: contains(github.event.comment.body, 'CALVIN REQUIRED:')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve terminal outcome
        id: terminal
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail

          # Drop leading blank/all-whitespace lines, then require the
          # marker on the first remaining line — the same first-line
          # terminal-marker convention terminal-routing-lib.sh applies to
          # CORRECT/DONE elsewhere in this repo's workflows. A quoted or
          # example "CALVIN REQUIRED:" appearing later in the comment body
          # can never match this.
          FIRST_LINE=$(printf '%s' "$COMMENT_BODY" \
            | sed -e '/[^[:space:]]/,$!d' -e 's/^[[:space:]]*//' \
            | head -n1 \
            | sed -e 's/[[:space:]]*$//')

          case "$FIRST_LINE" in
            "CALVIN REQUIRED:"*) ;;
            *)
              echo "notify=false" >> "$GITHUB_OUTPUT"
              echo "First non-empty line is not CALVIN REQUIRED:; no Slack alert."
              exit 0
              ;;
          esac

          ASK=${FIRST_LINE#CALVIN REQUIRED:}
          ASK=$(printf '%s' "$ASK" | sed -E 's/[[:space:]]*\[OWNER_ATTEMPT_ID:[^]]+\][[:space:]]*$//' | xargs)

          echo "notify=true" >> "$GITHUB_OUTPUT"
          {
            echo "ask<<EOF"
            echo "$ASK"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send Calvin Slack alert
        if: steps.terminal.outputs.notify == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.CALVIN_SLACK_WEBHOOK_URL }}
          ASK: ${{ steps.terminal.outputs.ask }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          ITEM_URL: ${{ github.event.issue.html_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::error::CALVIN_SLACK_WEBHOOK_URL repository secret is missing."
            exit 1
          fi

          PAYLOAD=$(jq -n \
            --arg repo "$REPO" \
            --arg ask "$ASK" \
            --arg item_url "$ITEM_URL" \
            --arg comment_url "$COMMENT_URL" \
            '{
              text: ("CALVIN REQUIRED — " + $repo + "\n" + (if ($ask | length) > 0 then $ask else "Your decision is needed." end) + "\n" + (if ($comment_url | length) > 0 then $comment_url else $item_url end))
            }')

          HTTP_CODE=$(curl -sS -o /tmp/slack_response.txt -w '%{http_code}' \
            --request POST "$SLACK_WEBHOOK_URL" \
            --header 'Content-Type: application/json' \
            --data "$PAYLOAD")

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Slack webhook failed with HTTP $HTTP_CODE"
            cat /tmp/slack_response.txt
            exit 1
          fi

          echo "Slack alert sent."
