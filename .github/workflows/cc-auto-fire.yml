name: Cal Finance execution routing

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # One short repo-wide admission lane. It ends after fire acceptance; liveness
  # observation is a separate job, so admission is never held for minutes.
  fire-build:
    if: >-
      github.event.label.name == 'needs-build-wake' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, 'CORRECT'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cf-build-admission
      cancel-in-progress: false
    outputs:
      fired: ${{ steps.fire.outputs.ok }}
      target_number: ${{ steps.resolve.outputs.number }}
      attempt_id: ${{ steps.resolve.outputs.attempt_id }}
      outcome_id: ${{ steps.resolve.outputs.outcome_id }}
    steps:
      - name: Check out runtime contract
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve and admit one outcome
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REPO: ${{ github.repository }}
          OWNER_FIRE_URL: ${{ secrets.OWNER_FIRE_URL }}
          OWNER_FIRE_TOKEN: ${{ secrets.OWNER_FIRE_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.CALVIN_SLACK_WEBHOOK_URL }}
        run: |
          set -uo pipefail
          source .github/scripts/runtime-lib.sh
          source .github/scripts/terminal-relay.sh

          # post_and_stop <line> <relay_source> — posts a workflow-authored
          # (GH_TOKEN-authored) admission-time terminal, then relays it to
          # OWNER/Slack directly in this same job (see terminal-relay.sh):
          # GH_TOKEN-authored comments never retrigger the issue_comment
          # event those paths would otherwise depend on.
          post_and_stop() {
            local line="$1" source="$2"
            gh api --method POST "repos/${REPO}/issues/${NUMBER}/comments" -f body="$line"
            terminal_relay_owner "$REPO" "$NUMBER" "$line" "$source"
            calvin_slack_send "$line" "$REPO" "https://github.com/${REPO}/issues/${NUMBER}" || true
            echo "skip=true" >> "$GITHUB_OUTPUT"
          }

          if [ "$EVENT_NAME" = "issue_comment" ]; then
            if [ "$(runtime_is_correct "$COMMENT_BODY")" != "true" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            NUMBER="${{ github.event.issue.number }}"
            KIND=pr
          elif [ -n "${{ github.event.pull_request.number }}" ]; then
            NUMBER="${{ github.event.pull_request.number }}"
            KIND=pr
          else
            NUMBER="${{ github.event.issue.number }}"
            KIND=issue
          fi

          TARGET=$(gh api "repos/${REPO}/issues/${NUMBER}")
          BODY=$(jq -r '.body // ""' <<< "$TARGET")
          OUTCOME_ID="$(runtime_outcome_id "$BODY")"
          TIER="$(runtime_tier "$BODY")"

          if [ -z "$OUTCOME_ID" ]; then
            post_and_stop "STOP: MISSING OUTCOME-ID — BUILD admission refused; add one stable OUTCOME-ID to the task contract." fire-build-resolve
            exit 0
          fi
          if [ "$TIER" = INVALID ]; then
            post_and_stop "STOP: INVALID TIER — use LIGHT, NORMAL, or HEAVY." fire-build-resolve
            exit 0
          fi
          # CF-REVIEW-BIND-01: a closed/superseded contract issue can no
          # longer keep routing/repair alive under a dead contract.
          if [ "$KIND" = issue ] && [ "$(jq -r '.state // "open"' <<< "$TARGET")" = closed ]; then
            post_and_stop "STOP: DEAD CONTRACT — ${OUTCOME_ID}'s contract issue #${NUMBER} is closed/superseded; no BUILD worker fired under a dead contract." fire-build-resolve
            exit 0
          fi
          # CF-REVIEW-BIND-01: PR-scoped dead-contract guard (KIND=pr) —
          # a CORRECT-triggered repair fire-build wake resolves to the PR
          # itself, so the issue-kind guard above never runs for it. Fail
          # closed the same way when the PR's own unambiguous Closes/Fixes/
          # Resolves source issue is closed/superseded.
          if [ "$KIND" = pr ]; then
            SRC_NUMBER="$(runtime_closing_issue_number "$BODY")"
            if [ -n "$SRC_NUMBER" ]; then
              SRC=$(gh api "repos/${REPO}/issues/${SRC_NUMBER}" 2>/dev/null || true)
              if [ -n "$SRC" ] && [ "$(jq -r '.state // "open"' <<< "$SRC")" = closed ]; then
                post_and_stop "STOP: DEAD CONTRACT — ${OUTCOME_ID}'s source issue #${SRC_NUMBER} is closed/superseded; no BUILD worker fired under a dead contract." fire-build-resolve
                exit 0
              fi
            fi
          fi

          COMMENTS=$(gh api --paginate "repos/${REPO}/issues/${NUMBER}/comments" \
            --jq '[.[] | {body: .body, created_at: .created_at}]' | jq -s 'add // []')

          # CF-REVIEW-BIND-01: enforce the already-approved bounded-repair
          # intent at runtime — a 4th CORRECT cycle without ACCEPT stops the
          # loop as BLOCKED: ACTIONABLE with the existing deterministic
          # resume path, instead of correcting indefinitely.
          if [ "$EVENT_NAME" = "issue_comment" ] && [ "$(runtime_correct_cycles_exhausted "$COMMENTS")" = true ]; then
            post_and_stop "BLOCKED: ACTIONABLE — ${OUTCOME_ID} repair loop exceeded 3 CORRECT cycles without ACCEPT; reapply the \`needs-build-wake\` label to #${NUMBER} to deliberately re-drive." fire-build-resolve
            exit 0
          fi

          ATTEMPT_OPEN="$(runtime_outcome_attempt_open "$COMMENTS" "$OUTCOME_ID")"

          OPEN_ITEMS=$(gh api --paginate "repos/${REPO}/issues?state=open&per_page=100" | jq -s 'add // []')
          MATCH_ISSUES=""
          MATCH_PRS=""
          while IFS= read -r encoded; do
            ITEM=$(printf '%s' "$encoded" | base64 --decode)
            ITEM_NUMBER=$(jq -r '.number' <<< "$ITEM")
            [ "$ITEM_NUMBER" = "$NUMBER" ] && continue
            ITEM_BODY=$(jq -r '.body // ""' <<< "$ITEM")
            ITEM_OUTCOME="$(runtime_outcome_id "$ITEM_BODY")"
            [ "$ITEM_OUTCOME" = "$OUTCOME_ID" ] || continue
            if [ "$(jq -r 'has("pull_request")' <<< "$ITEM")" = true ]; then
              MATCH_PRS="${MATCH_PRS:+${MATCH_PRS},}${ITEM_NUMBER}"
            else
              MATCH_ISSUES="${MATCH_ISSUES:+${MATCH_ISSUES},}${ITEM_NUMBER}"
            fi
          done < <(jq -r '.[] | @base64' <<< "$OPEN_ITEMS")

          DECISION="$(runtime_admission_decision "$KIND" "$NUMBER" "$MATCH_ISSUES" "$MATCH_PRS" "$ATTEMPT_OPEN")"
          case "$DECISION" in
            ADMIT) ;;
            IN_FLIGHT)
              gh api --method POST "repos/${REPO}/issues/${NUMBER}/comments" \
                -f body="BUILD ADMISSION: SUPPRESSED — ${OUTCOME_ID} already has an active BUILD attempt; no second worker fired."
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            EXISTING_PR:*)
              PR=${DECISION#EXISTING_PR:}
              gh api --method POST "repos/${REPO}/issues/${NUMBER}/comments" \
                -f body="BUILD ADMISSION: EXISTING PR #${PR} already owns ${OUTCOME_ID}; no second worker/PR fired."
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            CONFLICT)
              post_and_stop "STOP: RECONCILIATION REQUIRED — ${OUTCOME_ID} has multiple open issue/PR candidates (issues: ${MATCH_ISSUES:-none}; PRs: ${MATCH_PRS:-none}); no BUILD worker fired." fire-build-resolve
              exit 0 ;;
          esac

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "outcome_id=$OUTCOME_ID" >> "$GITHUB_OUTPUT"
          echo "tier=$TIER" >> "$GITHUB_OUTPUT"
          echo "attempt_id=BUILD-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          # CF-CONTRACT-FENCE-01: this attempt's loaded contract fingerprint,
          # stamped into the START receipt and handed to the worker so it can
          # fence a later route/merge/alert against a canonical contract that
          # changed mid-run (see BUILD.md's Stale contract fence).
          echo "contract=$(runtime_contract_hash "$BODY")" >> "$GITHUB_OUTPUT"

      - name: Fire BUILD
        id: fire
        if: steps.resolve.outputs.skip != 'true'
        env:
          BUILD_FIRE_URL: ${{ secrets.BUILD_FIRE_URL }}
          BUILD_FIRE_TOKEN: ${{ secrets.BUILD_FIRE_TOKEN }}
          NUMBER: ${{ steps.resolve.outputs.number }}
          OUTCOME_ID: ${{ steps.resolve.outputs.outcome_id }}
          TIER: ${{ steps.resolve.outputs.tier }}
          ATTEMPT_ID: ${{ steps.resolve.outputs.attempt_id }}
          CONTRACT: ${{ steps.resolve.outputs.contract }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SLACK_WEBHOOK_URL: ${{ secrets.CALVIN_SLACK_WEBHOOK_URL }}
        run: |
          set -uo pipefail
          source .github/scripts/fire-auth-lib.sh
          source .github/scripts/calvin-slack-notify.sh

          if [ -z "${BUILD_FIRE_URL:-}" ]; then
            SECRET=BUILD_FIRE_URL; CODE=missing_secret
          elif [ -z "${BUILD_FIRE_TOKEN:-}" ]; then
            SECRET=BUILD_FIRE_TOKEN; CODE=missing_secret
          else
            PROMPT="Repository ${REPO}, item #${NUMBER}. Run the current .github/ai-routines/BUILD.md for exact OUTCOME-ID ${OUTCOME_ID}, TIER ${TIER}. This run's BUILD_ATTEMPT_ID is ${ATTEMPT_ID} and its loaded contract fingerprint is CONTRACT: ${CONTRACT} (see BUILD.md's Stale contract fence); every terminal first line must carry [BUILD_ATTEMPT_ID: ${ATTEMPT_ID}]."
            CODE=$(fire_post "$BUILD_FIRE_URL" "$BUILD_FIRE_TOKEN" "$PROMPT" /tmp/build.json)
            SECRET=BUILD_FIRE_TOKEN
          fi

          if [ "$CODE" != curl_error ] && [ "$CODE" -ge 200 ] 2>/dev/null && [ "$CODE" -lt 300 ] 2>/dev/null; then
            SESSION=$(jq -r '.claude_code_session_id // "unknown"' /tmp/build.json)
            URL=$(jq -r '.claude_code_session_url // "unknown"' /tmp/build.json)
            gh api --method POST "repos/${REPO}/issues/${NUMBER}/comments" \
              -f body="BUILD START: OUTCOME-ID=${OUTCOME_ID} TIER=${TIER} · session ${SESSION} (${URL}) [BUILD_ATTEMPT_ID: ${ATTEMPT_ID}] [CONTRACT: ${CONTRACT}]"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            if [ "$(fire_auth_status "$CODE")" = auth ] || [ "$CODE" = missing_secret ]; then
              LINE="BLOCKED: ACTIONABLE — BUILD transport unavailable (${CODE}); refresh ${SECRET}. No worker started."
            elif [ "$(fire_transient_status "$CODE")" = true ]; then
              LINE="BLOCKED: ACTIONABLE — BUILD transport did not recover after 4 attempts (${CODE}); reapply the \`needs-build-wake\` label to #${NUMBER} to re-drive. No worker started."
            else
              LINE="BLOCKED: AI — BUILD transport failed (${CODE}); no worker started."
            fi
            gh api --method POST "repos/${REPO}/issues/${NUMBER}/comments" -f body="$LINE"
            # This is the fire call's own transport failure, not a genuine
            # BUILD/REVIEW/OWNER transition — relaying it into OWNER (which
            # fires over the same kind of transport) is exactly the #387
            # double-fire dead end this outcome closes, so it goes to Slack
            # only, never to terminal_relay_owner.
            calvin_slack_send "$LINE" "$REPO" "https://github.com/${REPO}/issues/${NUMBER}" || true
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clear BUILD wake label
        if: github.event.label.name == 'needs-build-wake'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method DELETE "repos/${{ github.repository }}/issues/${{ github.event.issue.number || github.event.pull_request.number }}/labels/needs-build-wake" || true

  observe-build:
    needs: fire-build
    if: needs.fire-build.outputs.fired == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Watch for BUILD terminal without re-fire
        id: watch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          TARGET_NUMBER: ${{ needs.fire-build.outputs.target_number }}
          ACTOR: BUILD
          ATTEMPT_ID: ${{ needs.fire-build.outputs.attempt_id }}
          TERMINAL_LEASE_MINUTES: '45'
        run: bash .github/scripts/terminal-watch.sh

      # terminal-watch.sh's own timeout receipt above ("BLOCKED: AI —
      # BUILD attempt ... produced no correlated terminal") is posted with
      # this job's GH_TOKEN, which cannot recursively trigger
      # fire-owner-on-terminal's issue_comment path (this outcome's own
      # observed defect: #361's BUILD left PR #362 orphaned this exact
      # way). Relay it into OWNER directly, in this same job, instead.
      - name: Relay a workflow-authored BUILD timeout terminal to OWNER
        if: steps.watch.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ needs.fire-build.outputs.target_number }}
          OWNER_FIRE_URL: ${{ secrets.OWNER_FIRE_URL }}
          OWNER_FIRE_TOKEN: ${{ secrets.OWNER_FIRE_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.CALVIN_SLACK_WEBHOOK_URL }}
        run: |
          set -uo pipefail
          source .github/scripts/terminal-relay.sh
          LINE="$(cat /tmp/terminal-watch-blocked-line.txt)"
          terminal_relay_owner "$REPO" "$NUMBER" "$LINE" observe-build-timeout

      - name: Fail the job when the terminal watch failed
        if: steps.watch.outcome == 'failure'
        run: exit 1

  fire-review:
    if: >-
      github.event.label.name == 'needs-cc-rereview' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, 'DONE:'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cf-review-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    outputs:
      fired: ${{ steps.fire.outputs.ok }}
      target_number: ${{ steps.resolve.outputs.number }}
      attempt_id: ${{ steps.resolve.outputs.attempt_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve REVIEW target
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REPO: ${{ github.repository }}
          OWNER_FIRE_URL: ${{ secrets.OWNER_FIRE_URL }}
          OWNER_FIRE_TOKEN: ${{ secrets.OWNER_FIRE_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.CALVIN_SLACK_WEBHOOK_URL }}
        run: |
          set -uo pipefail
          source .github/scripts/runtime-lib.sh
          source .github/scripts/terminal-relay.sh

          if [ "${{ github.event_name }}" = issue_comment ]; then
            FIRST="$(runtime_terminal_line "$COMMENT_BODY")"
            case "$FIRST" in
              "DONE: EVIDENCE"*) echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
              DONE:*) ;;
              *) echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
            NUMBER="$(runtime_done_pr_number "$COMMENT_BODY")"
            if [ -z "$NUMBER" ] && [ -n "${{ github.event.issue.pull_request.url }}" ]; then NUMBER="${{ github.event.issue.number }}"; fi
            if [ -z "$NUMBER" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          else
            NUMBER="${{ github.event.pull_request.number || github.event.issue.number }}"
          fi

          PR=$(gh api "repos/${REPO}/pulls/${NUMBER}" 2>/dev/null || true)
          if [ -z "$PR" ] || [ "$(jq -r '.state // "closed"' <<< "$PR")" != open ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BODY=$(jq -r '.body // ""' <<< "$PR")
          OUTCOME_ID="$(runtime_outcome_id "$BODY")"
          TIER="$(runtime_tier "$BODY")"
          # CF-CONTRACT-FENCE-01: the canonical body REVIEW's contract
          # fingerprint is taken from — starts as the PR body, switched to
          # the source issue below only when that fallback actually supplies
          # OUTCOME_ID, so the fingerprint always matches whichever body
          # this attempt actually bound its contract to.
          CONTRACT_BODY="$BODY"

          # CF-REVIEW-BIND-01: PR-scoped dead-contract guard covers a PR that carries its own OUTCOME-ID
          # too, not only the source-issue fallback below (which already
          # fails closed on a closed source issue when it's the one
          # supplying OUTCOME-ID). Same fail-closed rule either way: an
          # unambiguous Closes/Fixes/Resolves source issue that is
          # closed/superseded stops REVIEW under a dead contract.
          CONTRACT_FETCH_FAILED=false
          if [ -n "$OUTCOME_ID" ]; then
            SRC_NUMBER="$(runtime_closing_issue_number "$BODY")"
            if [ -n "$SRC_NUMBER" ]; then
              SRC=$(gh api "repos/${REPO}/issues/${SRC_NUMBER}" 2>/dev/null || true)
              if [ -n "$SRC" ] && [ "$(jq -r '.state // "open"' <<< "$SRC")" = closed ]; then
                LINE="STOP: DEAD CONTRACT — ${OUTCOME_ID}'s source issue #${SRC_NUMBER} is closed/superseded; no REVIEW worker fired under a dead contract."
                gh api --method POST "repos/${REPO}/issues/${NUMBER}/comments" -f body="$LINE"
                terminal_relay_owner "$REPO" "$NUMBER" "$LINE" fire-review-resolve
                echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
              fi
              # CF-CONTRACT-FENCE-01 (CORRECT on #397): fingerprint the same
              # unambiguous, currently-open source issue body this guard
              # already fetched, not the PR body — the PR body does not
              # change when Calvin edits the issue contract mid-run, so
              # hashing it would never detect that edit. Fall back to the PR
              # body (set above) only when there is no such source issue. A
              # transient failure fetching that source issue must not fall
              # back to the PR body silently — it emits an empty CONTRACT
              # instead (see the matching empty-CONTRACT handling in
              # fire-owner-on-terminal/owner-on-merge below), since
              # runtime_contract_is_stale already treats an empty
              # fingerprint as never stale.
              if [ -n "$SRC" ]; then
                CONTRACT_BODY="$(jq -r '.body // ""' <<< "$SRC")"
              else
                CONTRACT_FETCH_FAILED=true
              fi
            fi
          fi

          # CF-REVIEW-BIND-01: when the PR body itself carries no canonical
          # OUTCOME-ID, REVIEW may fall back to the PR's own Closes/Fixes/
          # Resolves source issue's OUTCOME-ID — but only when that relation
          # is unambiguous (exactly one referenced issue) and current (that
          # issue is still open, not closed/superseded). Any ambiguity or a
          # closed/superseded source issue is never used and falls through
          # to the same fail-closed STOP below as a PR with no OUTCOME-ID
          # at all — this is also the closed/superseded contract guard for
          # REVIEW's own resolution path.
          if [ -z "$OUTCOME_ID" ]; then
            SRC_NUMBER="$(runtime_closing_issue_number "$BODY")"
            if [ -n "$SRC_NUMBER" ]; then
              SRC=$(gh api "repos/${REPO}/issues/${SRC_NUMBER}" 2>/dev/null || true)
              if [ -n "$SRC" ] && [ "$(jq -r '.state // "closed"' <<< "$SRC")" = open ]; then
                SRC_BODY=$(jq -r '.body // ""' <<< "$SRC")
                SRC_OUTCOME_ID="$(runtime_outcome_id "$SRC_BODY")"
                if [ -n "$SRC_OUTCOME_ID" ]; then
                  OUTCOME_ID="$SRC_OUTCOME_ID"
                  TIER="$(runtime_tier "$SRC_BODY")"
                  CONTRACT_BODY="$SRC_BODY"
                fi
              fi
            fi
          fi

          if [ -z "$OUTCOME_ID" ]; then
            LINE="STOP: MISSING OUTCOME-ID — REVIEW cannot bind this PR to one task contract (no PR-body OUTCOME-ID and no unambiguous, current source-issue fallback)."
            gh api --method POST "repos/${REPO}/issues/${NUMBER}/comments" -f body="$LINE"
            # GH_TOKEN-authored; relay directly (see terminal-relay.sh).
            terminal_relay_owner "$REPO" "$NUMBER" "$LINE" fire-review-resolve
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          [ "$TIER" != INVALID ] || { echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }

          COMMENTS=$(gh api --paginate "repos/${{ github.repository }}/issues/${NUMBER}/comments" \
            --jq '[.[] | {body:.body, created_at:.created_at}]' | jq -s 'add // []')
          if [ "$(runtime_actor_attempt_open "$COMMENTS" REVIEW)" = true ]; then
            gh api --method POST "repos/${{ github.repository }}/issues/${NUMBER}/comments" \
              -f body="REVIEW ADMISSION: SUPPRESSED — an active reviewer already owns ${OUTCOME_ID}."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "outcome_id=$OUTCOME_ID" >> "$GITHUB_OUTPUT"
          echo "tier=$TIER" >> "$GITHUB_OUTPUT"
          echo "attempt_id=REVIEW-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          # CF-CONTRACT-FENCE-01: see the matching fire-build comment above.
          # A failed source-issue fetch emits an empty CONTRACT rather than
          # hashing the PR-body fallback, so it can never manufacture
          # staleness (see CONTRACT_FETCH_FAILED above).
          if [ "$CONTRACT_FETCH_FAILED" = true ]; then
            echo "contract=" >> "$GITHUB_OUTPUT"
          else
            echo "contract=$(runtime_contract_hash "$CONTRACT_BODY")" >> "$GITHUB_OUTPUT"
          fi

      - name: Fire REVIEW
        id: fire
        if: steps.resolve.outputs.skip != 'true'
        env:
          CC_AUTO_FIRE_URL: ${{ secrets.CC_AUTO_FIRE_URL }}
          CC_AUTO_FIRE_TOKEN: ${{ secrets.CC_AUTO_FIRE_TOKEN }}
          NUMBER: ${{ steps.resolve.outputs.number }}
          OUTCOME_ID: ${{ steps.resolve.outputs.outcome_id }}
          TIER: ${{ steps.resolve.outputs.tier }}
          ATTEMPT_ID: ${{ steps.resolve.outputs.attempt_id }}
          CONTRACT: ${{ steps.resolve.outputs.contract }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SLACK_WEBHOOK_URL: ${{ secrets.CALVIN_SLACK_WEBHOOK_URL }}
        run: |
          set -uo pipefail
          source .github/scripts/fire-auth-lib.sh
          source .github/scripts/calvin-slack-notify.sh
          if [ -z "${CC_AUTO_FIRE_URL:-}" ]; then SECRET=CC_AUTO_FIRE_URL; CODE=missing_secret
          elif [ -z "${CC_AUTO_FIRE_TOKEN:-}" ]; then SECRET=CC_AUTO_FIRE_TOKEN; CODE=missing_secret
          else
            PROMPT="Repository ${REPO}, PR #${NUMBER}. Run current .github/ai-routines/CC.md for exact OUTCOME-ID ${OUTCOME_ID}, TIER ${TIER}. This run's REVIEW_ATTEMPT_ID is ${ATTEMPT_ID} and its loaded contract fingerprint is CONTRACT: ${CONTRACT} (see CC.md's Stale contract fence); terminal first line must carry [REVIEW_ATTEMPT_ID: ${ATTEMPT_ID}]."
            CODE=$(fire_post "$CC_AUTO_FIRE_URL" "$CC_AUTO_FIRE_TOKEN" "$PROMPT" /tmp/review.json)
            SECRET=CC_AUTO_FIRE_TOKEN
          fi
          if [ "$CODE" != curl_error ] && [ "$CODE" -ge 200 ] 2>/dev/null && [ "$CODE" -lt 300 ] 2>/dev/null; then
            SESSION=$(jq -r '.claude_code_session_id // "unknown"' /tmp/review.json)
            URL=$(jq -r '.claude_code_session_url // "unknown"' /tmp/review.json)
            gh api --method POST "repos/${REPO}/issues/${NUMBER}/comments" \
              -f body="REVIEW START: OUTCOME-ID=${OUTCOME_ID} TIER=${TIER} · session ${SESSION} (${URL}) [REVIEW_ATTEMPT_ID: ${ATTEMPT_ID}] [CONTRACT: ${CONTRACT}]"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            if [ "$(fire_auth_status "$CODE")" = auth ] || [ "$CODE" = missing_secret ]; then
              LINE="BLOCKED: ACTIONABLE — REVIEW transport unavailable (${CODE}); refresh ${SECRET}."
            elif [ "$(fire_transient_status "$CODE")" = true ]; then
              LINE="BLOCKED: ACTIONABLE — REVIEW transport did not recover after 4 attempts (${CODE}); reapply the \`needs-cc-rereview\` label to PR #${NUMBER} to re-drive."
            else
              LINE="BLOCKED: AI — REVIEW transport failed (${CODE})."
            fi
            gh api --method POST "repos/${REPO}/issues/${NUMBER}/comments" -f body="$LINE"
            # This is the fire call's own transport failure, not a genuine
            # BUILD/REVIEW/OWNER transition — relaying it into OWNER (which
            # fires over the same kind of transport) is exactly the #387
            # double-fire dead end this outcome closes, so it goes to Slack
            # only, never to terminal_relay_owner.
            calvin_slack_send "$LINE" "$REPO" "https://github.com/${REPO}/issues/${NUMBER}" || true
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clear REVIEW wake label
        if: github.event.label.name == 'needs-cc-rereview'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method DELETE "repos/${{ github.repository }}/issues/${{ github.event.issue.number || github.event.pull_request.number }}/labels/needs-cc-rereview" || true

  observe-review:
    needs: fire-review
    if: needs.fire-review.outputs.fired == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Watch for REVIEW terminal without re-fire
        id: watch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          TARGET_NUMBER: ${{ needs.fire-review.outputs.target_number }}
          ACTOR: REVIEW
          ATTEMPT_ID: ${{ needs.fire-review.outputs.attempt_id }}
          TERMINAL_LEASE_MINUTES: '25'
        run: bash .github/scripts/terminal-watch.sh

      # Same GITHUB_TOKEN-recursion gap as observe-build's equivalent step
      # (see its comment, and terminal-watch.sh's own header) — relay
      # directly to OWNER instead of depending on an event that cannot
      # arrive.
      - name: Relay a workflow-authored REVIEW timeout terminal to OWNER
        if: steps.watch.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ needs.fire-review.outputs.target_number }}
          OWNER_FIRE_URL: ${{ secrets.OWNER_FIRE_URL }}
          OWNER_FIRE_TOKEN: ${{ secrets.OWNER_FIRE_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.CALVIN_SLACK_WEBHOOK_URL }}
        run: |
          set -uo pipefail
          source .github/scripts/terminal-relay.sh
          LINE="$(cat /tmp/terminal-watch-blocked-line.txt)"
          terminal_relay_owner "$REPO" "$NUMBER" "$LINE" observe-review-timeout

      - name: Fail the job when the terminal watch failed
        if: steps.watch.outcome == 'failure'
        run: exit 1

  fire-owner-on-terminal:
    if: >-
      github.event.label.name == 'needs-owner-wake' ||
      (github.event_name == 'issue_comment' &&
        (contains(github.event.comment.body, 'CALVIN RULING') ||
         contains(github.event.comment.body, 'DONE: EVIDENCE') ||
         contains(github.event.comment.body, 'STOP:') ||
         contains(github.event.comment.body, 'BLOCKED:') ||
         contains(github.event.comment.body, 'CALVIN REQUIRED:')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cf-owner-admission
      cancel-in-progress: false
    outputs:
      fired: ${{ steps.fire.outputs.ok }}
      target_number: ${{ steps.resolve.outputs.number }}
      attempt_id: ${{ steps.resolve.outputs.attempt_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve OWNER wake
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          IS_BOT: ${{ github.event.comment.user.type == 'Bot' }}
        run: |
          set -uo pipefail
          source .github/scripts/runtime-lib.sh
          source .github/scripts/calvin-ruling-lib.sh
          NUMBER="${{ github.event.issue.number || github.event.pull_request.number }}"
          COMMENTS=$(gh api --paginate "repos/${{ github.repository }}/issues/${NUMBER}/comments" \
            --jq '[.[] | {body:.body, created_at:.created_at}]' | jq -s 'add // []')

          if [ "${{ github.event_name }}" = issue_comment ]; then
            if [ "$(calvin_ruling_should_wake "$COMMENTS" "$COMMENT_BODY" "$IS_BOT")" = wake ]; then :
            elif [ "$(runtime_is_child_terminal "$COMMENT_BODY")" = true ]; then :
            else echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          fi

          if [ "$(runtime_actor_attempt_open "$COMMENTS" OWNER)" = true ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "attempt_id=OWNER-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          # CF-CONTRACT-FENCE-01 (CORRECT on #397): fingerprint the wake
          # target's unambiguous Closes/Fixes/Resolves source issue body,
          # open or closed, when the target is a PR carrying one — a PR
          # body does not change when Calvin edits the issue contract
          # mid-run, so hashing it would never detect that edit. This wake
          # can fire after the source issue closes on merge, so (unlike
          # REVIEW's own binding) it must not require the issue to still be
          # open. Fall back to the wake target's own body (issue or PR
          # alike) otherwise. An empty CONTRACT means the fetch itself
          # failed, never that the body was empty — runtime_contract_is_stale
          # treats an empty fingerprint as never stale, so a failed fetch
          # must not manufacture staleness by hashing an empty string.
          TARGET="$(gh api "repos/${{ github.repository }}/issues/${NUMBER}" 2>/dev/null || true)"
          if [ -n "$TARGET" ]; then
            CONTRACT_BODY="$(jq -r '.body // ""' <<< "$TARGET")"
            CONTRACT_FETCH_FAILED=false
            if [ "$(jq -r 'has("pull_request")' <<< "$TARGET")" = true ]; then
              SRC_NUMBER="$(runtime_closing_issue_number "$CONTRACT_BODY")"
              if [ -n "$SRC_NUMBER" ]; then
                SRC="$(gh api "repos/${{ github.repository }}/issues/${SRC_NUMBER}" 2>/dev/null || true)"
                if [ -n "$SRC" ]; then
                  CONTRACT_BODY="$(jq -r '.body // ""' <<< "$SRC")"
                else
                  CONTRACT_FETCH_FAILED=true
                fi
              fi
            fi
            if [ "$CONTRACT_FETCH_FAILED" = true ]; then
              echo "contract=" >> "$GITHUB_OUTPUT"
            else
              echo "contract=$(runtime_contract_hash "$CONTRACT_BODY")" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "contract=" >> "$GITHUB_OUTPUT"
          fi

      - name: Fire OWNER
        id: fire
        if: steps.resolve.outputs.skip != 'true'
        env:
          OWNER_FIRE_URL: ${{ secrets.OWNER_FIRE_URL }}
          OWNER_FIRE_TOKEN: ${{ secrets.OWNER_FIRE_TOKEN }}
          NUMBER: ${{ steps.resolve.outputs.number }}
          ATTEMPT_ID: ${{ steps.resolve.outputs.attempt_id }}
          CONTRACT: ${{ steps.resolve.outputs.contract }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SLACK_WEBHOOK_URL: ${{ secrets.CALVIN_SLACK_WEBHOOK_URL }}
        run: |
          set -uo pipefail
          source .github/scripts/fire-auth-lib.sh
          source .github/scripts/calvin-slack-notify.sh
          if [ -z "${OWNER_FIRE_URL:-}" ]; then SECRET=OWNER_FIRE_URL; CODE=missing_secret
          elif [ -z "${OWNER_FIRE_TOKEN:-}" ]; then SECRET=OWNER_FIRE_TOKEN; CODE=missing_secret
          else
            PROMPT="Repository ${REPO}, item #${NUMBER}, terminal/ruling wake. Follow current .github/ai-routines/OWNER.md exactly. This run's OWNER_ATTEMPT_ID is ${ATTEMPT_ID} and its loaded contract fingerprint is CONTRACT: ${CONTRACT} (see OWNER.md's Stale contract fence); parent terminal first line must carry [OWNER_ATTEMPT_ID: ${ATTEMPT_ID}]."
            CODE=$(fire_post "$OWNER_FIRE_URL" "$OWNER_FIRE_TOKEN" "$PROMPT" /tmp/owner.json)
            SECRET=OWNER_FIRE_TOKEN
          fi
          if [ "$CODE" != curl_error ] && [ "$CODE" -ge 200 ] 2>/dev/null && [ "$CODE" -lt 300 ] 2>/dev/null; then
            SESSION=$(jq -r '.claude_code_session_id // "unknown"' /tmp/owner.json)
            URL=$(jq -r '.claude_code_session_url // "unknown"' /tmp/owner.json)
            gh api --method POST "repos/${REPO}/issues/${NUMBER}/comments" \
              -f body="OWNER START: wake=TERMINAL · session ${SESSION} (${URL}) [OWNER_ATTEMPT_ID: ${ATTEMPT_ID}] [CONTRACT: ${CONTRACT}]"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            if [ "$(fire_auth_status "$CODE")" = auth ] || [ "$CODE" = missing_secret ]; then
              LINE="BLOCKED: ACTIONABLE — OWNER transport unavailable (${CODE}); refresh ${SECRET}. [OWNER_ATTEMPT_ID: ${ATTEMPT_ID}]"
            elif [ "$(fire_transient_status "$CODE")" = true ]; then
              LINE="BLOCKED: ACTIONABLE — OWNER transport did not recover after 4 attempts (${CODE}); reapply the \`needs-owner-wake\` label to #${NUMBER} to re-drive. [OWNER_ATTEMPT_ID: ${ATTEMPT_ID}]"
            else
              LINE="BLOCKED: AI — OWNER transport failed (${CODE}). [OWNER_ATTEMPT_ID: ${ATTEMPT_ID}]"
            fi
            gh api --method POST "repos/${REPO}/issues/${NUMBER}/comments" -f body="$LINE"
            # GH_TOKEN-authored; relay to Slack directly (see
            # calvin-slack-notify.sh). Not relayed to OWNER: OWNER is what
            # just failed to fire, so there is no BUILD/REVIEW/OWNER
            # transition here for OWNER to reconcile — only re-firing OWNER
            # over its own infra failure, which this outcome's ban on
            # relaying a transport failure into OWNER forbids outright.
            calvin_slack_send "$LINE" "$REPO" "https://github.com/${REPO}/issues/${NUMBER}" || true
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clear OWNER wake label
        if: github.event.label.name == 'needs-owner-wake'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method DELETE "repos/${{ github.repository }}/issues/${{ github.event.issue.number || github.event.pull_request.number }}/labels/needs-owner-wake" || true

  observe-owner-terminal:
    needs: fire-owner-on-terminal
    if: needs.fire-owner-on-terminal.outputs.fired == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Watch for OWNER terminal without re-fire
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          TARGET_NUMBER: ${{ needs.fire-owner-on-terminal.outputs.target_number }}
          ACTOR: OWNER
          ATTEMPT_ID: ${{ needs.fire-owner-on-terminal.outputs.attempt_id }}
          TERMINAL_LEASE_MINUTES: '25'
        run: bash .github/scripts/terminal-watch.sh
