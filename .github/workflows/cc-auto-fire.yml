name: Fire Cal Finance BUILD, REVIEW, and Chief of Staff refresh

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled, closed]

permissions:
  issues: write
  pull-requests: write

jobs:
  fire-build:
    if: >-
      github.event.label.name == 'needs-build-wake' ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.event.issue.state == 'open' &&
        contains(github.event.comment.body, 'CORRECT'))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -uo pipefail

          if [ "$EVENT_NAME" = "issue_comment" ]; then
            # Top-level PR conversation comment whose first terminal outcome is
            # CORRECT. Drop leading blank/all-whitespace lines, then trim
            # leading whitespace on the first non-empty line, so an
            # indented/quoted "CORRECT:" elsewhere in a comment can't
            # accidentally match, and resolve to this exact PR only (no
            # cross-PR link parsing).
            TRIMMED=$(printf '%s' "$COMMENT_BODY" | sed -e '/[^[:space:]]/,$!d' -e 's/^[[:space:]]*//')
            case "$TRIMMED" in
              CORRECT|CORRECT:*) ;;
              *)
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
            NUMBER="${{ github.event.issue.number }}"
          else
            NUMBER="${{ github.event.issue.number || github.event.pull_request.number }}"
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Fire CALBOARD-BUILD
        id: fire
        if: steps.target.outputs.skip != 'true'
        env:
          BUILD_FIRE_URL: ${{ secrets.BUILD_FIRE_URL }}
          BUILD_FIRE_TOKEN: ${{ secrets.BUILD_FIRE_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          TARGET_NUMBER: ${{ steps.target.outputs.number }}
        run: |
          set -uo pipefail

          if [ -z "${BUILD_FIRE_URL:-}" ] || [ -z "${BUILD_FIRE_TOKEN:-}" ]; then
            echo "http_code=missing_secret" >> "$GITHUB_OUTPUT"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PROMPT="Repository ${TARGET_REPO}, item #${TARGET_NUMBER}. Run CALBOARD-BUILD for this exact target. Always post DONE, BLOCKED, STOP, or CALVIN REQUIRED before ending."
          REQUEST_BODY=$(jq -n --arg text "$PROMPT" '{text: $text}')

          HTTP_CODE=$(curl -sS -o /tmp/build_response.json -w '%{http_code}' \
            --request POST "$BUILD_FIRE_URL" \
            --header "Authorization: Bearer $BUILD_FIRE_TOKEN" \
            --header "anthropic-version: 2023-06-01" \
            --header "anthropic-beta: experimental-cc-routine-2026-04-01" \
            --header "Content-Type: application/json" \
            --data "$REQUEST_BODY") || HTTP_CODE="curl_error"

          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          if [ "$HTTP_CODE" != "curl_error" ] && [ "$HTTP_CODE" -ge 200 ] 2>/dev/null && [ "$HTTP_CODE" -lt 300 ] 2>/dev/null; then
            echo "session_id=$(jq -r '.claude_code_session_id // "unknown"' /tmp/build_response.json)" >> "$GITHUB_OUTPUT"
            echo "session_url=$(jq -r '.claude_code_session_url // "unknown"' /tmp/build_response.json)" >> "$GITHUB_OUTPUT"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report BUILD fire
        if: steps.target.outputs.skip != 'true' && steps.fire.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/${{ steps.target.outputs.number }}/comments" \
            -f body="BUILD FIRED: HTTP ${{ steps.fire.outputs.http_code }} · session ${{ steps.fire.outputs.session_id }} (${{ steps.fire.outputs.session_url }})"

      - name: Remove BUILD wake label
        if: github.event.label.name == 'needs-build-wake' && steps.fire.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method DELETE \
            "repos/${{ github.repository }}/issues/${{ steps.target.outputs.number }}/labels/needs-build-wake" || true

      - name: Report BUILD fire failure
        if: steps.target.outputs.skip != 'true' && steps.fire.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/${{ steps.target.outputs.number }}/comments" \
            -f body="BUILD FIRE FAILED: HTTP ${{ steps.fire.outputs.http_code }}"
          exit 1

  fire-review:
    if: >-
      github.event.label.name == 'needs-cc-rereview' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, 'DONE:'))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target
        id: target
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            # Robust to leading blank/all-whitespace lines: drop them, then
            # trim leading whitespace on the first non-empty line and require
            # the terminal marker there. A quoted/example "DONE:" elsewhere
            # in the comment must not fire this.
            TRIMMED=$(printf '%s' "$COMMENT_BODY" | sed -e '/[^[:space:]]/,$!d' -e 's/^[[:space:]]*//')
            case "$TRIMMED" in
              DONE:*) ;;
              *)
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac

            NUMBER=$(printf '%s' "$COMMENT_BODY" | grep -oE '/pull/[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
            if [ -z "$NUMBER" ] && [ -n "${{ github.event.issue.pull_request.url }}" ]; then
              NUMBER="${{ github.event.issue.number }}"
            fi
            if [ -z "$NUMBER" ]; then
              gh api --method POST "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
                -f body="REVIEW FIRE SKIPPED: DONE comment carries no PR link"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            NUMBER="${{ github.event.issue.number || github.event.pull_request.number }}"
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Fire CALBOARD-CC-AUTO / REVIEW
        id: fire
        if: steps.target.outputs.skip != 'true'
        env:
          CC_AUTO_FIRE_URL: ${{ secrets.CC_AUTO_FIRE_URL }}
          CC_AUTO_FIRE_TOKEN: ${{ secrets.CC_AUTO_FIRE_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          TARGET_NUMBER: ${{ steps.target.outputs.number }}
        run: |
          set -uo pipefail

          if [ -z "${CC_AUTO_FIRE_URL:-}" ] || [ -z "${CC_AUTO_FIRE_TOKEN:-}" ]; then
            echo "http_code=missing_secret" >> "$GITHUB_OUTPUT"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PROMPT="Repository ${TARGET_REPO}, PR/item #${TARGET_NUMBER}. Run CALBOARD-CC-AUTO / REVIEW for this exact target. Post ACCEPT, CORRECT, CALVIN REQUIRED, or STOP before ending."
          REQUEST_BODY=$(jq -n --arg text "$PROMPT" '{text: $text}')

          HTTP_CODE=$(curl -sS -o /tmp/review_response.json -w '%{http_code}' \
            --request POST "$CC_AUTO_FIRE_URL" \
            --header "Authorization: Bearer $CC_AUTO_FIRE_TOKEN" \
            --header "anthropic-version: 2023-06-01" \
            --header "anthropic-beta: experimental-cc-routine-2026-04-01" \
            --header "Content-Type: application/json" \
            --data "$REQUEST_BODY") || HTTP_CODE="curl_error"

          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          if [ "$HTTP_CODE" != "curl_error" ] && [ "$HTTP_CODE" -ge 200 ] 2>/dev/null && [ "$HTTP_CODE" -lt 300 ] 2>/dev/null; then
            echo "session_id=$(jq -r '.claude_code_session_id // "unknown"' /tmp/review_response.json)" >> "$GITHUB_OUTPUT"
            echo "session_url=$(jq -r '.claude_code_session_url // "unknown"' /tmp/review_response.json)" >> "$GITHUB_OUTPUT"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report REVIEW fire
        if: steps.target.outputs.skip != 'true' && steps.fire.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/${{ steps.target.outputs.number }}/comments" \
            -f body="REVIEW FIRED: HTTP ${{ steps.fire.outputs.http_code }} · session ${{ steps.fire.outputs.session_id }} (${{ steps.fire.outputs.session_url }})"

      - name: Remove REVIEW wake label
        if: github.event.label.name == 'needs-cc-rereview' && steps.fire.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method DELETE \
            "repos/${{ github.repository }}/issues/${{ steps.target.outputs.number }}/labels/needs-cc-rereview" || true

      - name: Report REVIEW fire failure
        if: steps.target.outputs.skip != 'true' && steps.fire.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/${{ steps.target.outputs.number }}/comments" \
            -f body="REVIEW FIRE FAILED: HTTP ${{ steps.fire.outputs.http_code }}"
          exit 1

  # CF-OWNER-WATCH-SERIALIZE-01
  # WATCH used to fire in parallel from the raw merge event
  # (refresh-watch-on-merge), which could race OWNER's own Project Home
  # reconciliation and project stale state as "current". WATCH now fires
  # only from OWNER's own post-reconciliation receipt — a comment whose
  # first non-empty line is `OWNER RECONCILED:` — so it is always causally
  # downstream of a completed, read-back Project Home write. This fires for
  # both merge wakes and terminal (STOP / CALVIN REQUIRED) OWNER wakes,
  # since OWNER posts the same receipt on either path. The hourly WATCH
  # fallback is unaffected.
  fire-watch-on-owner-reconciled:
    if: >-
      github.event_name == 'issue_comment' &&
      contains(github.event.comment.body, 'OWNER RECONCILED:')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target
        id: target
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -uo pipefail

          # Require OWNER RECONCILED: on the first non-blank line so a
          # quoted/example mention elsewhere in a comment can't fire this.
          TRIMMED=$(printf '%s' "$COMMENT_BODY" | sed -e '/[^[:space:]]/,$!d' -e 's/^[[:space:]]*//')
          case "$TRIMMED" in
            "OWNER RECONCILED:"*) ;;
            *)
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          echo "url=${{ github.event.issue.html_url }}" >> "$GITHUB_OUTPUT"

      - name: Fire CHIEF-OF-STAFF-WATCH once for OWNER reconciliation receipt
        if: steps.target.outputs.skip != 'true'
        env:
          WATCH_FIRE_URL: ${{ secrets.WATCH_FIRE_URL }}
          WATCH_FIRE_TOKEN: ${{ secrets.WATCH_FIRE_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          TARGET_NUMBER: ${{ steps.target.outputs.number }}
          TARGET_URL: ${{ steps.target.outputs.url }}
        run: |
          set -uo pipefail

          if [ -z "${WATCH_FIRE_URL:-}" ] || [ -z "${WATCH_FIRE_TOKEN:-}" ]; then
            echo "WATCH reconciliation refresh skipped: WATCH_FIRE_URL or WATCH_FIRE_TOKEN missing."
            exit 0
          fi

          PROMPT="Projection refresh only. Repository ${TARGET_REPO} item #${TARGET_NUMBER} (${TARGET_URL}) posted an OWNER RECONCILED receipt: Project Home has been freshly reconciled and read back by OWNER. Refresh only the affected Chief of Staff row using current owner/native evidence. Do not dispatch, recover, rerank, or set ON=YOU unless the owner source currently records a Calvin-owned NEEDS YOU item."
          REQUEST_BODY=$(jq -n --arg text "$PROMPT" '{text: $text}')

          HTTP_CODE=$(curl -sS -o /tmp/watch_response.json -w '%{http_code}' \
            --request POST "$WATCH_FIRE_URL" \
            --header "Authorization: Bearer $WATCH_FIRE_TOKEN" \
            --header "anthropic-version: 2023-06-01" \
            --header "anthropic-beta: experimental-cc-routine-2026-04-01" \
            --header "Content-Type: application/json" \
            --data "$REQUEST_BODY") || HTTP_CODE="curl_error"

          if [ "$HTTP_CODE" = "curl_error" ] || [ "$HTTP_CODE" -lt 200 ] 2>/dev/null || [ "$HTTP_CODE" -ge 300 ] 2>/dev/null; then
            echo "WATCH reconciliation refresh failed: HTTP ${HTTP_CODE}."
            exit 1
          fi

  # CF-OWNER-RECONCILE-01
  # Terminal non-merge OWNER wake: BUILD/REVIEW apply needs-owner-wake only
  # for a true state-changing terminal outcome (STOP or CALVIN REQUIRED),
  # never for DONE, ACCEPT, MERGED, BLOCKED, CORRECT, or ordinary chatter.
  # OWNER itself never applies this label, so its own DISPATCHED/WAIT/
  # CALVIN REQUIRED output cannot re-fire this job.
  # CF-OWNER-LIVENESS-01 note: this job runs up to roughly two lease
  # windows long (~40 minutes at the default 20-minute lease) once the fire
  # below succeeds, because owner-liveness-guard.sh's bounded observation
  # window and single recovery run as later steps in this same job. See
  # that script and OWNER.md's "Liveness correlation" rule for the full
  # contract; the label-routing comment above this job is otherwise
  # unchanged.
  fire-owner-on-terminal:
    if: github.event.label.name == 'needs-owner-wake'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      # owner-liveness-guard.sh needs to exist on disk. Pinned explicitly to
      # the default branch: this job is reached via an `issues`/
      # `pull_request` labeled event, which has no natural head ref of its
      # own to fall back to.
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve target
        id: target
        run: |
          echo "number=${{ github.event.issue.number || github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          echo "attempt_id=TERMINAL-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Fire CALBOARD-OWNER API trigger
        id: fire
        env:
          OWNER_FIRE_URL: ${{ secrets.OWNER_FIRE_URL }}
          OWNER_FIRE_TOKEN: ${{ secrets.OWNER_FIRE_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          TARGET_NUMBER: ${{ steps.target.outputs.number }}
          ATTEMPT_ID: ${{ steps.target.outputs.attempt_id }}
        run: |
          set -uo pipefail

          if [ -z "${OWNER_FIRE_URL:-}" ] || [ -z "${OWNER_FIRE_TOKEN:-}" ]; then
            echo "::error::OWNER_FIRE_URL or OWNER_FIRE_TOKEN repository secret is missing."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "http_code=missing_secret" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PROMPT="Repository ${TARGET_REPO}, item #${TARGET_NUMBER} carries needs-owner-wake: a terminal STOP or CALVIN REQUIRED outcome, not a merge. Follow the current .github/ai-routines/OWNER.md adapter's terminal-wake path exactly: first reconcile the full owned current-state block in Cal Finance Project Home from fresh evidence (including this item's own terminal outcome) and read it back, then confirm whether a product BUILD or product PR is already in flight (this item usually still is), then either WAIT, dispatch at most one bounded already-authorised next outcome, or raise exactly one closed CALVIN REQUIRED question. Do not repair Chief of Staff, do not review or merge PRs, and do not take on any broader orchestration role beyond the owned-block reconciliation OWNER.md defines. This run's OWNER_ATTEMPT_ID is ${ATTEMPT_ID}: per OWNER.md's liveness correlation rule, your terminal receipt's first non-empty line must still be exactly one of the typed forms (DISPATCHED: / WAIT: AI — / WAIT: EXTERNAL — / WAIT: PARKED — / CALVIN REQUIRED:) and must also include the exact tag [OWNER_ATTEMPT_ID: ${ATTEMPT_ID}] on that same line."
          REQUEST_BODY=$(jq -n --arg text "$PROMPT" '{text: $text}')

          HTTP_CODE=$(curl -sS -o /tmp/owner_terminal_response.json -w '%{http_code}' \
            --request POST "$OWNER_FIRE_URL" \
            --header "Authorization: Bearer $OWNER_FIRE_TOKEN" \
            --header "anthropic-version: 2023-06-01" \
            --header "anthropic-beta: experimental-cc-routine-2026-04-01" \
            --header "Content-Type: application/json" \
            --data "$REQUEST_BODY") || HTTP_CODE="curl_error"

          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          if [ "$HTTP_CODE" != "curl_error" ] && [ "$HTTP_CODE" -ge 200 ] 2>/dev/null && [ "$HTTP_CODE" -lt 300 ] 2>/dev/null; then
            echo "session_id=$(jq -r '.claude_code_session_id // "unknown"' /tmp/owner_terminal_response.json)" >> "$GITHUB_OUTPUT"
            echo "session_url=$(jq -r '.claude_code_session_url // "unknown"' /tmp/owner_terminal_response.json)" >> "$GITHUB_OUTPUT"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report OWNER terminal-wake fire
        if: steps.fire.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/${{ steps.target.outputs.number }}/comments" \
            -f body="$(printf 'OWNER ATTEMPT START: %s\nwake_class: TERMINAL\nCF-OWNER-RECONCILE-01: fired CALBOARD-OWNER (terminal wake) for needs-owner-wake (HTTP %s). session: %s (%s)' \
              "${{ steps.target.outputs.attempt_id }}" "${{ steps.fire.outputs.http_code }}" "${{ steps.fire.outputs.session_id }}" "${{ steps.fire.outputs.session_url }}")"

      - name: Remove OWNER terminal-wake label
        if: steps.fire.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method DELETE \
            "repos/${{ github.repository }}/issues/${{ steps.target.outputs.number }}/labels/needs-owner-wake" || true

      - name: Report OWNER terminal-wake fire failure
        if: steps.fire.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/${{ steps.target.outputs.number }}/comments" \
            -f body="CF-OWNER-RECONCILE-01: CALBOARD-OWNER terminal-wake fire failed (HTTP ${{ steps.fire.outputs.http_code }})."
          exit 1

      # CF-OWNER-LIVENESS-01
      # Only reached once the fire above succeeded and the START receipt
      # landed. Watches this exact attempt for a correlated terminal
      # receipt, fires the one bounded recovery if it stalls, and posts the
      # durable exhaustion receipt if the recovery also stalls. Never
      # touches BUILD/REVIEW/Project Home itself.
      - name: Run OWNER liveness guard
        if: steps.fire.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER_FIRE_URL: ${{ secrets.OWNER_FIRE_URL }}
          OWNER_FIRE_TOKEN: ${{ secrets.OWNER_FIRE_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          TARGET_NUMBER: ${{ steps.target.outputs.number }}
          ATTEMPT_ID: ${{ steps.target.outputs.attempt_id }}
          WAKE_CLASS: TERMINAL
        run: bash .github/scripts/owner-liveness-guard.sh
