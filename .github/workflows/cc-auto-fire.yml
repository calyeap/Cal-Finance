name: Fire Cal Finance BUILD, REVIEW, and merge refresh

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled, closed]

permissions:
  issues: write
  pull-requests: write

jobs:
  fire-build:
    if: >-
      github.event.label.name == 'needs-build-wake' ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.event.issue.state == 'open' &&
        contains(github.event.comment.body, 'CORRECT'))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -uo pipefail

          if [ "$EVENT_NAME" = "issue_comment" ]; then
            # Top-level PR conversation comment whose first terminal outcome is
            # CORRECT. Trim leading whitespace only so an indented/quoted
            # "CORRECT:" elsewhere in a comment can't accidentally match, and
            # resolve to this exact PR only (no cross-PR link parsing).
            TRIMMED=$(printf '%s' "$COMMENT_BODY" | sed -e 's/^[[:space:]]*//')
            case "$TRIMMED" in
              CORRECT|CORRECT:*) ;;
              *)
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
            NUMBER="${{ github.event.issue.number }}"
          else
            NUMBER="${{ github.event.issue.number || github.event.pull_request.number }}"
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Fire CALBOARD-BUILD
        id: fire
        if: steps.target.outputs.skip != 'true'
        env:
          BUILD_FIRE_URL: ${{ secrets.BUILD_FIRE_URL }}
          BUILD_FIRE_TOKEN: ${{ secrets.BUILD_FIRE_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          TARGET_NUMBER: ${{ steps.target.outputs.number }}
        run: |
          set -uo pipefail

          if [ -z "${BUILD_FIRE_URL:-}" ] || [ -z "${BUILD_FIRE_TOKEN:-}" ]; then
            echo "http_code=missing_secret" >> "$GITHUB_OUTPUT"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PROMPT="Repository ${TARGET_REPO}, item #${TARGET_NUMBER}. Run CALBOARD-BUILD for this exact target. Always post DONE, BLOCKED, STOP, or CALVIN REQUIRED before ending."
          REQUEST_BODY=$(jq -n --arg text "$PROMPT" '{text: $text}')

          HTTP_CODE=$(curl -sS -o /tmp/build_response.json -w '%{http_code}' \
            --request POST "$BUILD_FIRE_URL" \
            --header "Authorization: Bearer $BUILD_FIRE_TOKEN" \
            --header "anthropic-version: 2023-06-01" \
            --header "anthropic-beta: experimental-cc-routine-2026-04-01" \
            --header "Content-Type: application/json" \
            --data "$REQUEST_BODY") || HTTP_CODE="curl_error"

          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          if [ "$HTTP_CODE" != "curl_error" ] && [ "$HTTP_CODE" -ge 200 ] 2>/dev/null && [ "$HTTP_CODE" -lt 300 ] 2>/dev/null; then
            echo "session_id=$(jq -r '.claude_code_session_id // "unknown"' /tmp/build_response.json)" >> "$GITHUB_OUTPUT"
            echo "session_url=$(jq -r '.claude_code_session_url // "unknown"' /tmp/build_response.json)" >> "$GITHUB_OUTPUT"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report BUILD fire
        if: steps.target.outputs.skip != 'true' && steps.fire.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/${{ steps.target.outputs.number }}/comments" \
            -f body="BUILD FIRED: HTTP ${{ steps.fire.outputs.http_code }} · session ${{ steps.fire.outputs.session_id }} (${{ steps.fire.outputs.session_url }})"

      - name: Remove BUILD wake label
        if: github.event.label.name == 'needs-build-wake' && steps.fire.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method DELETE \
            "repos/${{ github.repository }}/issues/${{ steps.target.outputs.number }}/labels/needs-build-wake" || true

      - name: Report BUILD fire failure
        if: steps.target.outputs.skip != 'true' && steps.fire.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/${{ steps.target.outputs.number }}/comments" \
            -f body="BUILD FIRE FAILED: HTTP ${{ steps.fire.outputs.http_code }}"
          exit 1

  fire-review:
    if: >-
      github.event.label.name == 'needs-cc-rereview' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, 'DONE:'))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target
        id: target
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            # Robust to leading whitespace only: trim, then require the
            # terminal marker at the very start. A quoted/example "DONE:"
            # elsewhere in the comment must not fire this.
            TRIMMED=$(printf '%s' "$COMMENT_BODY" | sed -e 's/^[[:space:]]*//')
            case "$TRIMMED" in
              DONE:*) ;;
              *)
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac

            NUMBER=$(printf '%s' "$COMMENT_BODY" | grep -oE '/pull/[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
            if [ -z "$NUMBER" ] && [ -n "${{ github.event.issue.pull_request.url }}" ]; then
              NUMBER="${{ github.event.issue.number }}"
            fi
            if [ -z "$NUMBER" ]; then
              gh api --method POST "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
                -f body="REVIEW FIRE SKIPPED: DONE comment carries no PR link"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            NUMBER="${{ github.event.issue.number || github.event.pull_request.number }}"
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Fire CALBOARD-CC-AUTO / REVIEW
        id: fire
        if: steps.target.outputs.skip != 'true'
        env:
          CC_AUTO_FIRE_URL: ${{ secrets.CC_AUTO_FIRE_URL }}
          CC_AUTO_FIRE_TOKEN: ${{ secrets.CC_AUTO_FIRE_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          TARGET_NUMBER: ${{ steps.target.outputs.number }}
        run: |
          set -uo pipefail

          if [ -z "${CC_AUTO_FIRE_URL:-}" ] || [ -z "${CC_AUTO_FIRE_TOKEN:-}" ]; then
            echo "http_code=missing_secret" >> "$GITHUB_OUTPUT"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PROMPT="Repository ${TARGET_REPO}, PR/item #${TARGET_NUMBER}. Run CALBOARD-CC-AUTO / REVIEW for this exact target. Post ACCEPT, CORRECT, CALVIN REQUIRED, or STOP before ending."
          REQUEST_BODY=$(jq -n --arg text "$PROMPT" '{text: $text}')

          HTTP_CODE=$(curl -sS -o /tmp/review_response.json -w '%{http_code}' \
            --request POST "$CC_AUTO_FIRE_URL" \
            --header "Authorization: Bearer $CC_AUTO_FIRE_TOKEN" \
            --header "anthropic-version: 2023-06-01" \
            --header "anthropic-beta: experimental-cc-routine-2026-04-01" \
            --header "Content-Type: application/json" \
            --data "$REQUEST_BODY") || HTTP_CODE="curl_error"

          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          if [ "$HTTP_CODE" != "curl_error" ] && [ "$HTTP_CODE" -ge 200 ] 2>/dev/null && [ "$HTTP_CODE" -lt 300 ] 2>/dev/null; then
            echo "session_id=$(jq -r '.claude_code_session_id // "unknown"' /tmp/review_response.json)" >> "$GITHUB_OUTPUT"
            echo "session_url=$(jq -r '.claude_code_session_url // "unknown"' /tmp/review_response.json)" >> "$GITHUB_OUTPUT"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report REVIEW fire
        if: steps.target.outputs.skip != 'true' && steps.fire.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/${{ steps.target.outputs.number }}/comments" \
            -f body="REVIEW FIRED: HTTP ${{ steps.fire.outputs.http_code }} · session ${{ steps.fire.outputs.session_id }} (${{ steps.fire.outputs.session_url }})"

      - name: Remove REVIEW wake label
        if: github.event.label.name == 'needs-cc-rereview' && steps.fire.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method DELETE \
            "repos/${{ github.repository }}/issues/${{ steps.target.outputs.number }}/labels/needs-cc-rereview" || true

      - name: Report REVIEW fire failure
        if: steps.target.outputs.skip != 'true' && steps.fire.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/${{ steps.target.outputs.number }}/comments" \
            -f body="REVIEW FIRE FAILED: HTTP ${{ steps.fire.outputs.http_code }}"
          exit 1

  refresh-watch-on-merge:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Fire CHIEF-OF-STAFF-WATCH once for verified merge
        env:
          WATCH_FIRE_URL: ${{ secrets.WATCH_FIRE_URL }}
          WATCH_FIRE_TOKEN: ${{ secrets.WATCH_FIRE_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          TARGET_NUMBER: ${{ github.event.pull_request.number }}
          TARGET_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail

          if [ -z "${WATCH_FIRE_URL:-}" ] || [ -z "${WATCH_FIRE_TOKEN:-}" ]; then
            echo "WATCH merge refresh skipped: WATCH_FIRE_URL or WATCH_FIRE_TOKEN missing."
            exit 0
          fi

          PROMPT="Projection refresh only. Repository ${TARGET_REPO} PR #${TARGET_NUMBER} merged (${TARGET_URL}). Refresh only the affected Chief of Staff row using current owner/native evidence. Do not dispatch, recover, rerank, or set ON=YOU unless the owner source currently records a Calvin-owned NEEDS YOU item."
          REQUEST_BODY=$(jq -n --arg text "$PROMPT" '{text: $text}')

          HTTP_CODE=$(curl -sS -o /tmp/watch_response.json -w '%{http_code}' \
            --request POST "$WATCH_FIRE_URL" \
            --header "Authorization: Bearer $WATCH_FIRE_TOKEN" \
            --header "anthropic-version: 2023-06-01" \
            --header "anthropic-beta: experimental-cc-routine-2026-04-01" \
            --header "Content-Type: application/json" \
            --data "$REQUEST_BODY") || HTTP_CODE="curl_error"

          if [ "$HTTP_CODE" = "curl_error" ] || [ "$HTTP_CODE" -lt 200 ] 2>/dev/null || [ "$HTTP_CODE" -ge 300 ] 2>/dev/null; then
            echo "WATCH merge refresh failed: HTTP ${HTTP_CODE}."
            exit 1
          fi
