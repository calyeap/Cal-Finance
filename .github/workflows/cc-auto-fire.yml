name: Fire Calboard routines on dispatch labels

# OUTCOME-ID: CB-WATCH-FIRE-01
#
# Closes the FIRE leg of the correction path: nothing currently wakes
# CALBOARD-CC-AUTO after BUILD pushes a correction, since its only GitHub
# trigger is "Pull request: Opened". Labelling an issue or PR
# `needs-cc-rereview` fires the CALBOARD-CC-AUTO routine API trigger
# directly. Bounded to CALBOARD-CC-AUTO only — do not repoint this job at
# any other routine.
#
# OUTCOME-ID: CB-OWNER-FIRE-01
#
# Closes the DISPATCH gap: CALBOARD-OWNER's only trigger is a merged PR,
# so it cannot cold-start when no PR is pending. Labelling an issue or PR
# `dispatch-next` fires the CALBOARD-OWNER routine API trigger directly.
# Bounded to CALBOARD-OWNER only — do not repoint this job at any other
# routine.
#
# OUTCOME-ID: CB-BUILD-WAKE-01
#
# Closes the WAKE gap: an issue opened by a routine (e.g. CALBOARD-OWNER's
# autonomous dispatch) does not wake CALBOARD-BUILD, so autonomous dispatch
# can open issues into a void. Labelling an issue or PR `needs-build-wake`
# fires the CALBOARD-BUILD routine API trigger directly, to pick up work
# already dispatched to it. Bounded to CALBOARD-BUILD only — do not
# repoint this job at any other routine.
#
# OUTCOME-ID: CB-COCKPIT-EVENTS-01
#
# Closes the cockpit staleness gap: CHIEF-OF-STAFF-WATCH only has a native
# `Pull request: Opened` trigger, so a comment or a settings change by
# Calvin (a confirmation, an answer, a close, a visibility change) never
# wakes it — the cockpit can sit on a stale sweep until the next hourly
# run. The routines UI caps native triggers at three, so this job uses the
# same API-fire path as the three jobs above: any `calyeap`-authored,
# non-bot issue/PR comment that does not carry the agent-post marker fires
# CHIEF-OF-STAFF-WATCH directly. Bounded to CHIEF-OF-STAFF-WATCH only — do
# not repoint this job at any other routine.
#
# The author + marker filter is a loop-prevention control, not an
# authorship control: all routines post under `calyeap`, so the marker
# (not the author) is what stops a routine's own comment from re-firing
# this job. The marker is self-reported — its absence does not prove a
# comment is human, only that this job did not post it. There is no label
# to remove as a loop guard here (no label drives this trigger), so the
# job instead debounces bursts with a job-scoped `concurrency` group
# (`cancel-in-progress: true`), so several comments in quick succession
# collapse to roughly one fire rather than one session per comment.
#
# OUTCOME-ID: CB-WAKE-RACE-01 — 15 Sep 2026
#
# THE LOOP GUARD WAS DELETING THE LABEL BEFORE THE WOKEN SESSION COULD
# READ IT. Each label job fired the routine, got HTTP 200 back in under a
# second, and immediately deleted the label. The fired session starts
# afterwards, looks for the labelled item its Start gate requires, finds
# no labelled issue, and correctly STOPs.
#
# Observed twice on issue #98 (CB-CONFLICT-B-REMEDY-01). Sessions
# cse_01UgJRAUHC9LKbeaHpmJAtKC (14 Sep 16:19 UTC) and
# cse_01WP1UQXrWQ4mXbCEEJAeqTx (15 Sep 04:30 UTC) both started, both
# posted nothing, and neither created a claim/ branch. The second one
# reported, in its own words: "No open issue currently carries the
# needs-build-wake label." It knew exactly what to look for. The guard had
# already removed it.
#
# This also explains why some wakes worked and some did not: it is a race,
# not a consistent failure. Issue #93 was picked up normally on 14 Sep.
# The difference is how fast the session started, not anything about the
# issue.
#
# THE FIX: wait before removing the label. The guard still runs, so
# re-labelling still re-fires and no loop is possible — it simply stops
# winning the race against the session it just started.
#
# A LARGER SUSPECTED DEFECT IS NOT ADDRESSED HERE, DELIBERATELY. Each fire
# posts a prompt naming the repository and item number, but both
# CALBOARD-BUILD and CALBOARD-CC-AUTO reported on 15 Sep receiving "only
# the generic procedure text — no issue/PR reference, no event payload",
# and CALBOARD-BUILD described itself as a "scheduled run" despite having
# no schedule trigger. If the prompt genuinely is not delivered, the label
# is the ONLY context a fired session ever has, which makes this fix
# necessary either way. Establishing that is a separate read-only
# investigation; two session self-reports are evidence, not proof.

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write

jobs:
  fire:
    if: github.event.label.name == 'needs-cc-rereview'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve labelled item number
        id: target
        run: |
          NUMBER="${{ github.event.issue.number || github.event.pull_request.number }}"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Fire CALBOARD-CC-AUTO API trigger
        id: fire
        env:
          CC_AUTO_FIRE_URL: ${{ secrets.CC_AUTO_FIRE_URL }}
          CC_AUTO_FIRE_TOKEN: ${{ secrets.CC_AUTO_FIRE_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          TARGET_NUMBER: ${{ steps.target.outputs.number }}
        run: |
          set -uo pipefail

          if [ -z "${CC_AUTO_FIRE_URL:-}" ] || [ -z "${CC_AUTO_FIRE_TOKEN:-}" ]; then
            echo "::error::CC_AUTO_FIRE_URL or CC_AUTO_FIRE_TOKEN repository secret is missing."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PROMPT="Repository ${TARGET_REPO}, item #${TARGET_NUMBER} was labelled needs-cc-rereview and needs CALBOARD-CC-AUTO to re-review it."
          REQUEST_BODY=$(jq -n --arg prompt "$PROMPT" '{prompt: $prompt}')

          HTTP_CODE=$(curl -sS -o /tmp/cc_auto_fire_response.json -w '%{http_code}' \
            --request POST "$CC_AUTO_FIRE_URL" \
            --header "Authorization: Bearer $CC_AUTO_FIRE_TOKEN" \
            --header "anthropic-version: 2023-06-01" \
            --header "Content-Type: application/json" \
            --data "$REQUEST_BODY") || HTTP_CODE="curl_error"

          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"

          if [ "$HTTP_CODE" != "curl_error" ] && [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            SESSION_ID=$(jq -r '.claude_code_session_id // "unknown"' /tmp/cc_auto_fire_response.json)
            SESSION_URL=$(jq -r '.claude_code_session_url // "unknown"' /tmp/cc_auto_fire_response.json)
            echo "session_id=$SESSION_ID" >> "$GITHUB_OUTPUT"
            echo "session_url=$SESSION_URL" >> "$GITHUB_OUTPUT"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report success on the labelled item
        if: steps.fire.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/${{ steps.target.outputs.number }}/comments" \
            -f body="CB-WATCH-FIRE-01: fired CALBOARD-CC-AUTO (HTTP ${{ steps.fire.outputs.http_code }}). session: ${{ steps.fire.outputs.session_id }} (${{ steps.fire.outputs.session_url }})"

      # CB-WAKE-RACE-01: the woken session needs the label still present to
      # identify its own target. Removing it immediately is what produced the
      # silent STOPs on #98. Reporting first, then waiting, gives the session
      # time to start and read before the guard clears it.
      - name: Remove label (loop guard, delayed)
        if: steps.fire.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 600
          gh api --method DELETE \
            "repos/${{ github.repository }}/issues/${{ steps.target.outputs.number }}/labels/needs-cc-rereview"

      - name: Report failure on the labelled item and fail visibly
        if: steps.fire.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CC_AUTO_FIRE_TOKEN: ${{ secrets.CC_AUTO_FIRE_TOKEN }}
        run: |
          RAW_BODY=$(cat /tmp/cc_auto_fire_response.json 2>/dev/null || echo "(no response body — request may not have completed)")
          if [ -n "${CC_AUTO_FIRE_TOKEN:-}" ]; then
            SAFE_BODY=$(printf '%s' "$RAW_BODY" | sed "s/${CC_AUTO_FIRE_TOKEN}/[REDACTED]/g")
          else
            SAFE_BODY="$RAW_BODY"
          fi

          COMMENT_BODY=$(printf 'CB-WATCH-FIRE-01: CALBOARD-CC-AUTO fire failed (HTTP %s).\n\n```\n%s\n```' "${{ steps.fire.outputs.http_code }}" "$SAFE_BODY")

          gh api --method POST \
            "repos/${{ github.repository }}/issues/${{ steps.target.outputs.number }}/comments" \
            -f body="$COMMENT_BODY"

          echo "::error::CALBOARD-CC-AUTO fire failed with HTTP ${{ steps.fire.outputs.http_code }}"
          exit 1

  fire-owner:
    if: github.event.label.name == 'dispatch-next'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve labelled item number
        id: target
        run: |
          NUMBER="${{ github.event.issue.number || github.event.pull_request.number }}"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Fire CALBOARD-OWNER API trigger
        id: fire
        env:
          OWNER_FIRE_URL: ${{ secrets.OWNER_FIRE_URL }}
          OWNER_FIRE_TOKEN: ${{ secrets.OWNER_FIRE_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          TARGET_NUMBER: ${{ steps.target.outputs.number }}
        run: |
          set -uo pipefail

          if [ -z "${OWNER_FIRE_URL:-}" ] || [ -z "${OWNER_FIRE_TOKEN:-}" ]; then
            echo "::error::OWNER_FIRE_URL or OWNER_FIRE_TOKEN repository secret is missing."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PROMPT="Repository ${TARGET_REPO}, item #${TARGET_NUMBER} was labelled dispatch-next. This is a dispatch fire: reconcile current Calboard project state, read the Calboard Project Home Runway, and open the next dependency-safe authorised outcome yourself."
          REQUEST_BODY=$(jq -n --arg prompt "$PROMPT" '{prompt: $prompt}')

          HTTP_CODE=$(curl -sS -o /tmp/owner_fire_response.json -w '%{http_code}' \
            --request POST "$OWNER_FIRE_URL" \
            --header "Authorization: Bearer $OWNER_FIRE_TOKEN" \
            --header "anthropic-version: 2023-06-01" \
            --header "Content-Type: application/json" \
            --data "$REQUEST_BODY") || HTTP_CODE="curl_error"

          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"

          if [ "$HTTP_CODE" != "curl_error" ] && [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            SESSION_ID=$(jq -r '.claude_code_session_id // "unknown"' /tmp/owner_fire_response.json)
            SESSION_URL=$(jq -r '.claude_code_session_url // "unknown"' /tmp/owner_fire_response.json)
            echo "session_id=$SESSION_ID" >> "$GITHUB_OUTPUT"
            echo "session_url=$SESSION_URL" >> "$GITHUB_OUTPUT"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report success on the labelled item
        if: steps.fire.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/${{ steps.target.outputs.number }}/comments" \
            -f body="CB-OWNER-FIRE-01: fired CALBOARD-OWNER (HTTP ${{ steps.fire.outputs.http_code }}). session: ${{ steps.fire.outputs.session_id }} (${{ steps.fire.outputs.session_url }})"

      # CB-WAKE-RACE-01: see the fire job above.
      - name: Remove label (loop guard, delayed)
        if: steps.fire.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 600
          gh api --method DELETE \
            "repos/${{ github.repository }}/issues/${{ steps.target.outputs.number }}/labels/dispatch-next"

      - name: Report failure on the labelled item and fail visibly
        if: steps.fire.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER_FIRE_TOKEN: ${{ secrets.OWNER_FIRE_TOKEN }}
        run: |
          RAW_BODY=$(cat /tmp/owner_fire_response.json 2>/dev/null || echo "(no response body — request may not have completed)")
          if [ -n "${OWNER_FIRE_TOKEN:-}" ]; then
            SAFE_BODY=$(printf '%s' "$RAW_BODY" | sed "s/${OWNER_FIRE_TOKEN}/[REDACTED]/g")
          else
            SAFE_BODY="$RAW_BODY"
          fi

          COMMENT_BODY=$(printf 'CB-OWNER-FIRE-01: CALBOARD-OWNER fire failed (HTTP %s).\n\n```\n%s\n```' "${{ steps.fire.outputs.http_code }}" "$SAFE_BODY")

          gh api --method POST \
            "repos/${{ github.repository }}/issues/${{ steps.target.outputs.number }}/comments" \
            -f body="$COMMENT_BODY"

          echo "::error::CALBOARD-OWNER fire failed with HTTP ${{ steps.fire.outputs.http_code }}"
          exit 1

  fire-build:
    if: github.event.label.name == 'needs-build-wake'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve labelled item number
        id: target
        run: |
          NUMBER="${{ github.event.issue.number || github.event.pull_request.number }}"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Fire CALBOARD-BUILD API trigger
        id: fire
        env:
          BUILD_FIRE_URL: ${{ secrets.BUILD_FIRE_URL }}
          BUILD_FIRE_TOKEN: ${{ secrets.BUILD_FIRE_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          TARGET_NUMBER: ${{ steps.target.outputs.number }}
        run: |
          set -uo pipefail

          if [ -z "${BUILD_FIRE_URL:-}" ] || [ -z "${BUILD_FIRE_TOKEN:-}" ]; then
            echo "::error::BUILD_FIRE_URL or BUILD_FIRE_TOKEN repository secret is missing."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PROMPT="Repository ${TARGET_REPO}, item #${TARGET_NUMBER} was labelled needs-build-wake. CALBOARD-BUILD was woken to pick up work already dispatched to it on that item."
          REQUEST_BODY=$(jq -n --arg prompt "$PROMPT" '{prompt: $prompt}')

          HTTP_CODE=$(curl -sS -o /tmp/build_fire_response.json -w '%{http_code}' \
            --request POST "$BUILD_FIRE_URL" \
            --header "Authorization: Bearer $BUILD_FIRE_TOKEN" \
            --header "anthropic-version: 2023-06-01" \
            --header "Content-Type: application/json" \
            --data "$REQUEST_BODY") || HTTP_CODE="curl_error"

          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"

          if [ "$HTTP_CODE" != "curl_error" ] && [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            SESSION_ID=$(jq -r '.claude_code_session_id // "unknown"' /tmp/build_fire_response.json)
            SESSION_URL=$(jq -r '.claude_code_session_url // "unknown"' /tmp/build_fire_response.json)
            echo "session_id=$SESSION_ID" >> "$GITHUB_OUTPUT"
            echo "session_url=$SESSION_URL" >> "$GITHUB_OUTPUT"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report success on the labelled item
        if: steps.fire.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/${{ steps.target.outputs.number }}/comments" \
            -f body="CB-BUILD-WAKE-01: fired CALBOARD-BUILD (HTTP ${{ steps.fire.outputs.http_code }}). session: ${{ steps.fire.outputs.session_id }} (${{ steps.fire.outputs.session_url }})"

      # CB-WAKE-RACE-01: this is the job the defect was observed on. Issue #98
      # was fired twice and both sessions STOPped after finding no labelled
      # issue, because this step had already deleted the label.
      - name: Remove label (loop guard, delayed)
        if: steps.fire.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 600
          gh api --method DELETE \
            "repos/${{ github.repository }}/issues/${{ steps.target.outputs.number }}/labels/needs-build-wake"

      - name: Report failure on the labelled item and fail visibly
        if: steps.fire.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_FIRE_TOKEN: ${{ secrets.BUILD_FIRE_TOKEN }}
        run: |
          RAW_BODY=$(cat /tmp/build_fire_response.json 2>/dev/null || echo "(no response body — request may not have completed)")
          if [ -n "${BUILD_FIRE_TOKEN:-}" ]; then
            SAFE_BODY=$(printf '%s' "$RAW_BODY" | sed "s/${BUILD_FIRE_TOKEN}/[REDACTED]/g")
          else
            SAFE_BODY="$RAW_BODY"
          fi

          COMMENT_BODY=$(printf 'CB-BUILD-WAKE-01: CALBOARD-BUILD fire failed (HTTP %s).\n\n```\n%s\n```' "${{ steps.fire.outputs.http_code }}" "$SAFE_BODY")

          gh api --method POST \
            "repos/${{ github.repository }}/issues/${{ steps.target.outputs.number }}/comments" \
            -f body="$COMMENT_BODY"

          echo "::error::CALBOARD-BUILD fire failed with HTTP ${{ steps.fire.outputs.http_code }}"
          exit 1

  fire-watch:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.comment.user.login == 'calyeap' &&
      github.event.comment.user.type != 'Bot' &&
      !startsWith(github.event.comment.body, '🤖 AGENT POST')
    runs-on: ubuntu-latest
    concurrency:
      group: cc-auto-fire-watch-${{ github.repository }}
      cancel-in-progress: true
    steps:
      - name: Resolve commented-on item number
        id: target
        run: |
          NUMBER="${{ github.event.issue.number }}"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Fire CHIEF-OF-STAFF-WATCH API trigger
        id: fire
        env:
          WATCH_FIRE_URL: ${{ secrets.WATCH_FIRE_URL }}
          WATCH_FIRE_TOKEN: ${{ secrets.WATCH_FIRE_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          TARGET_NUMBER: ${{ steps.target.outputs.number }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
        run: |
          set -uo pipefail

          if [ -z "${WATCH_FIRE_URL:-}" ] || [ -z "${WATCH_FIRE_TOKEN:-}" ]; then
            echo "::error::WATCH_FIRE_URL or WATCH_FIRE_TOKEN repository secret is missing."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PROMPT="Repository ${TARGET_REPO}, item #${TARGET_NUMBER} got a new comment (${COMMENT_URL}) from calyeap without the agent-post marker. CHIEF-OF-STAFF-WATCH was woken to refresh the cockpit against current GitHub state rather than waiting for the next hourly sweep."
          REQUEST_BODY=$(jq -n --arg prompt "$PROMPT" '{prompt: $prompt}')

          HTTP_CODE=$(curl -sS -o /tmp/watch_fire_response.json -w '%{http_code}' \
            --request POST "$WATCH_FIRE_URL" \
            --header "Authorization: Bearer $WATCH_FIRE_TOKEN" \
            --header "anthropic-version: 2023-06-01" \
            --header "Content-Type: application/json" \
            --data "$REQUEST_BODY") || HTTP_CODE="curl_error"

          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"

          if [ "$HTTP_CODE" != "curl_error" ] && [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            SESSION_ID=$(jq -r '.claude_code_session_id // "unknown"' /tmp/watch_fire_response.json)
            SESSION_URL=$(jq -r '.claude_code_session_url // "unknown"' /tmp/watch_fire_response.json)
            echo "session_id=$SESSION_ID" >> "$GITHUB_OUTPUT"
            echo "session_url=$SESSION_URL" >> "$GITHUB_OUTPUT"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report success on the commented-on item
        if: steps.fire.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/${{ steps.target.outputs.number }}/comments" \
            -f body="CB-COCKPIT-EVENTS-01: fired CHIEF-OF-STAFF-WATCH (HTTP ${{ steps.fire.outputs.http_code }}). session: ${{ steps.fire.outputs.session_id }} (${{ steps.fire.outputs.session_url }})"

      - name: Report failure on the commented-on item and fail visibly
        if: steps.fire.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WATCH_FIRE_TOKEN: ${{ secrets.WATCH_FIRE_TOKEN }}
        run: |
          RAW_BODY=$(cat /tmp/watch_fire_response.json 2>/dev/null || echo "(no response body — request may not have completed)")
          if [ -n "${WATCH_FIRE_TOKEN:-}" ]; then
            SAFE_BODY=$(printf '%s' "$RAW_BODY" | sed "s/${WATCH_FIRE_TOKEN}/[REDACTED]/g")
          else
            SAFE_BODY="$RAW_BODY"
          fi

          COMMENT_BODY=$(printf 'CB-COCKPIT-EVENTS-01: CHIEF-OF-STAFF-WATCH fire failed (HTTP %s).\n\n```\n%s\n```' "${{ steps.fire.outputs.http_code }}" "$SAFE_BODY")

          gh api --method POST \
            "repos/${{ github.repository }}/issues/${{ steps.target.outputs.number }}/comments" \
            -f body="$COMMENT_BODY"

          echo "::error::CHIEF-OF-STAFF-WATCH fire failed with HTTP ${{ steps.fire.outputs.http_code }}"
          exit 1
