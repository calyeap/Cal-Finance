name: CI

# Protected evaluator for Cal Finance. Runtime routing may consume this signal;
# workers must not weaken it merely to make their own attempt pass.
on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: calboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/calboard_test

    steps:
      - name: Check out pull request head
        uses: actions/checkout@v4

      # Workflow reset replacement coverage. These tests encode the real
      # duplicate/liveness/terminal/Slack failure classes before legacy guards
      # are eligible for deletion.
      - name: Run compact runtime unit tests
        run: bash .github/scripts/runtime-lib.test.sh

      - name: Run detect-only liveness tests
        run: bash .github/scripts/terminal-watch.test.sh

      - name: Run runtime wiring replacement tests
        run: bash .github/scripts/runtime-wiring.test.sh

      # Still-live compact classifiers retained from the previous runtime.
      - name: Run fire-auth classification tests
        run: bash .github/scripts/fire-auth-lib.test.sh

      - name: Run Calvin ruling classification tests
        run: bash .github/scripts/calvin-ruling-lib.test.sh

      - name: Run Slack terminal notifier tests
        run: bash .github/scripts/calvin-slack-notify.test.sh

      - name: Run workflow-authored terminal relay tests
        run: bash .github/scripts/terminal-relay.test.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install zip dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zip
          zip --version | head -n 2

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Apply migrations to disposable test database
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: npm run migrate

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full test suite
        run: npm test
