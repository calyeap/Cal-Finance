name: Fire Cal Finance OWNER on merged PR

# CF-OWNER-DISPATCH-01 / CF-OWNER-RECONCILE-01
# Deterministic continuation path: a successfully merged PR wakes CALBOARD-OWNER
# directly as a post-merge dispatcher that reconciles Project Home before
# dispatching (see .github/ai-routines/OWNER.md). This workflow does not
# depend on dispatch-next or any label for the normal merge path. The
# terminal-outcome (non-merge) OWNER wake lives in cc-auto-fire.yml, gated on
# the needs-owner-wake label BUILD/REVIEW apply for a STOP or CALVIN
# REQUIRED outcome.

on:
  pull_request:
    types: [closed]

permissions:
  issues: write
  pull-requests: write

jobs:
  fire-owner-on-merge:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Resolve merged PR
        id: target
        run: |
          echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

      - name: Fire CALBOARD-OWNER API trigger
        id: fire
        env:
          OWNER_FIRE_URL: ${{ secrets.OWNER_FIRE_URL }}
          OWNER_FIRE_TOKEN: ${{ secrets.OWNER_FIRE_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          TARGET_NUMBER: ${{ steps.target.outputs.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -uo pipefail

          if [ -z "${OWNER_FIRE_URL:-}" ] || [ -z "${OWNER_FIRE_TOKEN:-}" ]; then
            echo "::error::OWNER_FIRE_URL or OWNER_FIRE_TOKEN repository secret is missing."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "http_code=missing_secret" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PROMPT="Repository ${TARGET_REPO}, PR #${TARGET_NUMBER} merged at ${MERGE_SHA}. This is the native post-merge OWNER continuation wake. Follow the current .github/ai-routines/OWNER.md adapter exactly: first reconcile the full owned current-state block in Cal Finance Project Home from fresh evidence and read it back, then confirm no active product BUILD or product PR is already in flight, then create at most one bounded, dependency-safe, already-authorised GitHub issue with needs-build-wake applied. If no safe dispatch exists, return a justified WAIT. If a genuine product/methodology/architecture decision is required, raise exactly one closed CALVIN REQUIRED question. Do not repair Chief of Staff, do not review or merge PRs, and do not take on any broader orchestration role beyond the owned-block reconciliation OWNER.md defines."
          REQUEST_BODY=$(jq -n --arg text "$PROMPT" '{text: $text}')

          HTTP_CODE=$(curl -sS -o /tmp/owner_merge_response.json -w '%{http_code}' \
            --request POST "$OWNER_FIRE_URL" \
            --header "Authorization: Bearer $OWNER_FIRE_TOKEN" \
            --header "anthropic-version: 2023-06-01" \
            --header "anthropic-beta: experimental-cc-routine-2026-04-01" \
            --header "Content-Type: application/json" \
            --data "$REQUEST_BODY") || HTTP_CODE="curl_error"

          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"

          if [ "$HTTP_CODE" != "curl_error" ] && [ "$HTTP_CODE" -ge 200 ] 2>/dev/null && [ "$HTTP_CODE" -lt 300 ] 2>/dev/null; then
            SESSION_ID=$(jq -r '.claude_code_session_id // "unknown"' /tmp/owner_merge_response.json)
            SESSION_URL=$(jq -r '.claude_code_session_url // "unknown"' /tmp/owner_merge_response.json)
            echo "session_id=$SESSION_ID" >> "$GITHUB_OUTPUT"
            echo "session_url=$SESSION_URL" >> "$GITHUB_OUTPUT"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record OWNER continuation fire
        if: steps.fire.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/${{ steps.target.outputs.number }}/comments" \
            -f body="CF-OWNER-DISPATCH-01: fired CALBOARD-OWNER (tiny dispatcher) from merged PR (HTTP ${{ steps.fire.outputs.http_code }}). session: ${{ steps.fire.outputs.session_id }} (${{ steps.fire.outputs.session_url }})"

      - name: Report OWNER continuation fire failure
        if: steps.fire.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER_FIRE_TOKEN: ${{ secrets.OWNER_FIRE_TOKEN }}
        run: |
          RAW_BODY=$(cat /tmp/owner_merge_response.json 2>/dev/null || echo "(no response body — request may not have completed)")
          if [ -n "${OWNER_FIRE_TOKEN:-}" ]; then
            SAFE_BODY=$(printf '%s' "$RAW_BODY" | sed "s/${OWNER_FIRE_TOKEN}/[REDACTED]/g")
          else
            SAFE_BODY="$RAW_BODY"
          fi

          COMMENT_BODY=$(printf 'CF-OWNER-DISPATCH-01: CALBOARD-OWNER merged-PR fire failed (HTTP %s).\n\n```\n%s\n```' "${{ steps.fire.outputs.http_code }}" "$SAFE_BODY")
          gh api --method POST \
            "repos/${{ github.repository }}/issues/${{ steps.target.outputs.number }}/comments" \
            -f body="$COMMENT_BODY"

          echo "::error::CALBOARD-OWNER merged-PR fire failed with HTTP ${{ steps.fire.outputs.http_code }}"
          exit 1
