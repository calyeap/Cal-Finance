name: Cal Finance parent continuation on merge

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  fire-owner-on-merge:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cf-owner-admission
      cancel-in-progress: false
    outputs:
      fired: ${{ steps.fire.outputs.ok }}
      target_number: ${{ steps.resolve.outputs.number }}
      attempt_id: ${{ steps.resolve.outputs.attempt_id }}
    steps:
      - name: Check out landed runtime
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Admit one OWNER
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          source .github/scripts/runtime-lib.sh
          NUMBER="${{ github.event.pull_request.number }}"
          COMMENTS=$(gh api --paginate "repos/${{ github.repository }}/issues/${NUMBER}/comments" \
            --jq '[.[] | {body:.body, created_at:.created_at}]' | jq -s 'add // []')
          if [ "$(runtime_actor_attempt_open "$COMMENTS" OWNER)" = true ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "attempt_id=OWNER-MERGE-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          # CF-CONTRACT-FENCE-01 (CORRECT on #397): fingerprint the merged
          # PR's unambiguous Closes/Fixes/Resolves source issue body when
          # it has one — the merged PR body cannot change afterward, so
          # hashing it would never detect a Calvin edit made to the issue
          # contract during REVIEW. This wake always fires after merge, so
          # the source issue is normally already closed by then; do not
          # require it to be open (unlike REVIEW's own binding). Fall back
          # to the PR's own body otherwise. An empty CONTRACT means the
          # fetch itself failed, never that the body was empty (see
          # cc-auto-fire.yml's matching fire-owner-on-terminal comment).
          TARGET="$(gh api "repos/${{ github.repository }}/issues/${NUMBER}" 2>/dev/null || true)"
          if [ -n "$TARGET" ]; then
            CONTRACT_BODY="$(jq -r '.body // ""' <<< "$TARGET")"
            CONTRACT_FETCH_FAILED=false
            SRC_NUMBER="$(runtime_closing_issue_number "$CONTRACT_BODY")"
            if [ -n "$SRC_NUMBER" ]; then
              SRC="$(gh api "repos/${{ github.repository }}/issues/${SRC_NUMBER}" 2>/dev/null || true)"
              if [ -n "$SRC" ]; then
                CONTRACT_BODY="$(jq -r '.body // ""' <<< "$SRC")"
              else
                CONTRACT_FETCH_FAILED=true
              fi
            fi
            if [ "$CONTRACT_FETCH_FAILED" = true ]; then
              echo "contract=" >> "$GITHUB_OUTPUT"
            else
              echo "contract=$(runtime_contract_hash "$CONTRACT_BODY")" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "contract=" >> "$GITHUB_OUTPUT"
          fi

      - name: Fire OWNER
        id: fire
        if: steps.resolve.outputs.skip != 'true'
        env:
          OWNER_FIRE_URL: ${{ secrets.OWNER_FIRE_URL }}
          OWNER_FIRE_TOKEN: ${{ secrets.OWNER_FIRE_TOKEN }}
          NUMBER: ${{ steps.resolve.outputs.number }}
          ATTEMPT_ID: ${{ steps.resolve.outputs.attempt_id }}
          CONTRACT: ${{ steps.resolve.outputs.contract }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SLACK_WEBHOOK_URL: ${{ secrets.CALVIN_SLACK_WEBHOOK_URL }}
        run: |
          set -uo pipefail
          source .github/scripts/fire-auth-lib.sh
          source .github/scripts/calvin-slack-notify.sh
          if [ -z "${OWNER_FIRE_URL:-}" ]; then SECRET=OWNER_FIRE_URL; CODE=missing_secret
          elif [ -z "${OWNER_FIRE_TOKEN:-}" ]; then SECRET=OWNER_FIRE_TOKEN; CODE=missing_secret
          else
            PROMPT="Repository ${REPO}, PR #${NUMBER} merged at ${{ github.event.pull_request.merge_commit_sha }}. Follow current .github/ai-routines/OWNER.md exactly for this MERGE wake. This run's OWNER_ATTEMPT_ID is ${ATTEMPT_ID} and its loaded contract fingerprint is CONTRACT: ${CONTRACT} (see OWNER.md's Stale contract fence); parent terminal first line must carry [OWNER_ATTEMPT_ID: ${ATTEMPT_ID}]."
            CODE=$(fire_post "$OWNER_FIRE_URL" "$OWNER_FIRE_TOKEN" "$PROMPT" /tmp/owner.json)
            SECRET=OWNER_FIRE_TOKEN
          fi
          if [ "$CODE" != curl_error ] && [ "$CODE" -ge 200 ] 2>/dev/null && [ "$CODE" -lt 300 ] 2>/dev/null; then
            SESSION=$(jq -r '.claude_code_session_id // "unknown"' /tmp/owner.json)
            URL=$(jq -r '.claude_code_session_url // "unknown"' /tmp/owner.json)
            gh api --method POST "repos/${REPO}/issues/${NUMBER}/comments" \
              -f body="OWNER START: wake=MERGE · session ${SESSION} (${URL}) [OWNER_ATTEMPT_ID: ${ATTEMPT_ID}] [CONTRACT: ${CONTRACT}]"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            if [ "$(fire_auth_status "$CODE")" = auth ] || [ "$CODE" = missing_secret ]; then
              LINE="BLOCKED: ACTIONABLE — OWNER transport unavailable (${CODE}); refresh ${SECRET}. [OWNER_ATTEMPT_ID: ${ATTEMPT_ID}]"
            elif [ "$(fire_transient_status "$CODE")" = true ]; then
              LINE="BLOCKED: ACTIONABLE — OWNER transport did not recover after 4 attempts (${CODE}); reapply the \`needs-owner-wake\` label to PR #${NUMBER} to re-drive. [OWNER_ATTEMPT_ID: ${ATTEMPT_ID}]"
            else
              LINE="BLOCKED: AI — OWNER transport failed (${CODE}). [OWNER_ATTEMPT_ID: ${ATTEMPT_ID}]"
            fi
            gh api --method POST "repos/${REPO}/issues/${NUMBER}/comments" -f body="$LINE"
            # GH_TOKEN-authored; relay to Slack directly (see
            # calvin-slack-notify.sh and cc-auto-fire.yml's matching Fire
            # OWNER step for why this never relays to OWNER itself).
            calvin_slack_send "$LINE" "$REPO" "https://github.com/${REPO}/issues/${NUMBER}" || true
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

  observe-owner-merge:
    needs: fire-owner-on-merge
    if: needs.fire-owner-on-merge.outputs.fired == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Watch for OWNER terminal without re-fire
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          TARGET_NUMBER: ${{ needs.fire-owner-on-merge.outputs.target_number }}
          ACTOR: OWNER
          ATTEMPT_ID: ${{ needs.fire-owner-on-merge.outputs.attempt_id }}
          TERMINAL_LEASE_MINUTES: '25'
        run: bash .github/scripts/terminal-watch.sh
