name: Fire Cal Finance OWNER on merged PR

# CF-OWNER-DISPATCH-01 / CF-OWNER-RECONCILE-01
# Deterministic continuation path: a successfully merged PR wakes CALBOARD-OWNER
# directly as a post-merge dispatcher that reads fresh native GitHub evidence
# before dispatching (see .github/ai-routines/OWNER.md) — OWNER never writes
# to or reads back Project Home. This workflow does not
# depend on dispatch-next or any label for the normal merge path. The
# terminal-outcome (non-merge) OWNER wake lives in cc-auto-fire.yml's
# fire-owner-on-terminal job, admitted directly from a top-level DONE:
# EVIDENCE / STOP: / BLOCKED: / CALVIN REQUIRED: comment BUILD or REVIEW
# posts (CF-TERMINAL-HANDOFF-REPAIR-01); the needs-owner-wake label remains
# only as a manual/recovery compatibility path, no longer required.
#
# CF-OWNER-LIVENESS-01
# HTTP 2xx from the fire below proves only that an OWNER session was
# created, not that it later produced a terminal result — the PR #180
# failure this outcome exists to close. Each fire here carries one unique
# OWNER_ATTEMPT_ID that OWNER must echo in its terminal receipt (see
# OWNER.md's "Liveness correlation" rule), and once the fire succeeds and
# the START receipt below is posted, .github/scripts/owner-liveness-guard.sh
# takes over: one bounded observation window, at most one recovery fire,
# and a durable exhaustion receipt if that recovery also stalls. This job
# therefore now legitimately runs up to roughly two lease windows long
# (~40 minutes at the default 20-minute lease), not just a few seconds.
#
# CF-OWNER-SINGLE-WRITER-01
# issue #197 documented live evidence of overlapping CALBOARD-OWNER
# attempts (fired from this workflow's merge wake and cc-auto-fire.yml's
# terminal wake, on different PRs/issues) racing the same Cal Finance
# Project Home write. The `cf-owner-single-writer` concurrency group below
# is shared verbatim with cc-auto-fire.yml's fire-owner-on-terminal job:
# GitHub Actions runs at most one job in that group at a time, queues a
# second arrival, and — if a third arrives while the second is still
# queued — replaces the queued one with the newest, so a later wake is
# never permanently lost and a stale wake can never run (and therefore
# commit) after a newer one. owner-single-writer-guard.sh below only adds
# a readable audit trail on top of that; it never blocks the fire itself.
# See .github/ai-routines/OWNER.md and owner-single-writer-lib.test.sh /
# owner-single-writer-config.test.sh.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  fire-owner-on-merge:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: cf-owner-single-writer
      cancel-in-progress: false
    steps:
      # owner-liveness-guard.sh needs to exist on disk. Pinned to the merge
      # commit itself (not the default `github.ref`, which for a closed
      # pull_request event is the PR's synthetic merge ref and can be gone
      # by the time this runs) so this always checks out exactly what
      # landed on the base branch.
      - name: Check out merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Resolve merged PR
        id: target
        run: |
          echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          echo "attempt_id=MERGE-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      # CF-OWNER-SINGLE-WRITER-01: advisory only — see the header comment
      # above and owner-single-writer-guard.sh. Never blocks; the
      # cf-owner-single-writer concurrency group on this job is what
      # actually prevents overlapping fires.
      - name: Record OWNER admission context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          TARGET_NUMBER: ${{ steps.target.outputs.number }}
          ATTEMPT_ID: ${{ steps.target.outputs.attempt_id }}
        run: bash .github/scripts/owner-single-writer-guard.sh

      - name: Fire CALBOARD-OWNER API trigger
        id: fire
        env:
          OWNER_FIRE_URL: ${{ secrets.OWNER_FIRE_URL }}
          OWNER_FIRE_TOKEN: ${{ secrets.OWNER_FIRE_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          TARGET_NUMBER: ${{ steps.target.outputs.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          ATTEMPT_ID: ${{ steps.target.outputs.attempt_id }}
        run: |
          set -uo pipefail
          # shellcheck source=../scripts/fire-auth-lib.sh
          source .github/scripts/fire-auth-lib.sh

          if [ -z "${OWNER_FIRE_URL:-}" ]; then
            echo "::error::OWNER_FIRE_URL repository secret is missing."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "http_code=missing_secret" >> "$GITHUB_OUTPUT"
            echo "missing_secret_name=OWNER_FIRE_URL" >> "$GITHUB_OUTPUT"
            echo "auth_blocked=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${OWNER_FIRE_TOKEN:-}" ]; then
            echo "::error::OWNER_FIRE_TOKEN repository secret is missing."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "http_code=missing_secret" >> "$GITHUB_OUTPUT"
            echo "missing_secret_name=OWNER_FIRE_TOKEN" >> "$GITHUB_OUTPUT"
            echo "auth_blocked=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PROMPT="Repository ${TARGET_REPO}, PR #${TARGET_NUMBER} merged at ${MERGE_SHA}. wake_class: MERGE. Follow the current .github/ai-routines/OWNER.md adapter exactly from its Process section — read current native GitHub evidence only, then decide. Do not take on any broader orchestration role beyond what OWNER.md defines. This run's OWNER_ATTEMPT_ID is ${ATTEMPT_ID}: per OWNER.md's liveness correlation rule, your terminal receipt's first non-empty line must still be exactly one of the typed forms (DISPATCHED: / WAIT: AI — / WAIT: EXTERNAL — / WAIT: PARKED — / CALVIN REQUIRED:) and must also include the exact tag [OWNER_ATTEMPT_ID: ${ATTEMPT_ID}] on that same line."
          REQUEST_BODY=$(jq -n --arg text "$PROMPT" '{text: $text}')

          HTTP_CODE=$(curl -sS -o /tmp/owner_merge_response.json -w '%{http_code}' \
            --request POST "$OWNER_FIRE_URL" \
            --header "Authorization: Bearer $OWNER_FIRE_TOKEN" \
            --header "anthropic-version: 2023-06-01" \
            --header "anthropic-beta: experimental-cc-routine-2026-04-01" \
            --header "Content-Type: application/json" \
            --data "$REQUEST_BODY") || HTTP_CODE="curl_error"

          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"

          if [ "$HTTP_CODE" != "curl_error" ] && [ "$HTTP_CODE" -ge 200 ] 2>/dev/null && [ "$HTTP_CODE" -lt 300 ] 2>/dev/null; then
            SESSION_ID=$(jq -r '.claude_code_session_id // "unknown"' /tmp/owner_merge_response.json)
            SESSION_URL=$(jq -r '.claude_code_session_url // "unknown"' /tmp/owner_merge_response.json)
            echo "session_id=$SESSION_ID" >> "$GITHUB_OUTPUT"
            echo "session_url=$SESSION_URL" >> "$GITHUB_OUTPUT"
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "auth_blocked=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            if [ "$(fire_auth_status "$HTTP_CODE")" = "auth" ]; then
              echo "missing_secret_name=OWNER_FIRE_TOKEN" >> "$GITHUB_OUTPUT"
              echo "auth_blocked=true" >> "$GITHUB_OUTPUT"
            else
              echo "auth_blocked=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Record OWNER continuation fire
        if: steps.fire.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/${{ steps.target.outputs.number }}/comments" \
            -f body="$(printf 'OWNER ATTEMPT START: %s\nwake_class: MERGE\nCF-OWNER-DISPATCH-01: fired CALBOARD-OWNER (tiny dispatcher) from merged PR (HTTP %s). session: %s (%s)' \
              "${{ steps.target.outputs.attempt_id }}" "${{ steps.fire.outputs.http_code }}" "${{ steps.fire.outputs.session_id }}" "${{ steps.fire.outputs.session_url }}")"

      - name: Report OWNER continuation fire failure
        if: steps.fire.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER_FIRE_TOKEN: ${{ secrets.OWNER_FIRE_TOKEN }}
        run: |
          set -uo pipefail
          # shellcheck source=../scripts/fire-auth-lib.sh
          source .github/scripts/fire-auth-lib.sh

          if [ "${{ steps.fire.outputs.auth_blocked }}" = "true" ]; then
            # CF-HANDOFF-FAIL-CLOSED-01: never print the response body for an
            # auth-classified failure — it may carry the credential itself.
            COMMENT_BODY="$(fire_auth_blocked_body OWNER "${{ steps.fire.outputs.missing_secret_name }}" "${{ steps.fire.outputs.http_code }}")"
          else
            RAW_BODY=$(cat /tmp/owner_merge_response.json 2>/dev/null || echo "(no response body — request may not have completed)")
            if [ -n "${OWNER_FIRE_TOKEN:-}" ]; then
              SAFE_BODY=$(printf '%s' "$RAW_BODY" | sed "s/${OWNER_FIRE_TOKEN}/[REDACTED]/g")
            else
              SAFE_BODY="$RAW_BODY"
            fi
            COMMENT_BODY=$(printf 'CF-OWNER-DISPATCH-01: CALBOARD-OWNER merged-PR fire failed (HTTP %s).\n\n```\n%s\n```' "${{ steps.fire.outputs.http_code }}" "$SAFE_BODY")
          fi

          gh api --method POST \
            "repos/${{ github.repository }}/issues/${{ steps.target.outputs.number }}/comments" \
            -f body="$COMMENT_BODY"

          echo "::error::CALBOARD-OWNER merged-PR fire failed with HTTP ${{ steps.fire.outputs.http_code }}"
          exit 1

      # CF-OWNER-LIVENESS-01
      # Only reached once the fire above succeeded and the START receipt
      # landed. Watches this exact attempt for a correlated terminal
      # receipt, fires the one bounded recovery if it stalls, and posts the
      # durable exhaustion receipt if the recovery also stalls. Never
      # touches BUILD/REVIEW/Project Home itself.
      - name: Run OWNER liveness guard
        if: steps.fire.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER_FIRE_URL: ${{ secrets.OWNER_FIRE_URL }}
          OWNER_FIRE_TOKEN: ${{ secrets.OWNER_FIRE_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          TARGET_NUMBER: ${{ steps.target.outputs.number }}
          ATTEMPT_ID: ${{ steps.target.outputs.attempt_id }}
          WAKE_CLASS: MERGE
        run: bash .github/scripts/owner-liveness-guard.sh
