name: Cal Finance Chief of Staff semantic refresh

# Thin projection bridge only.
# Native GitHub activity is execution truth; Cal Finance Project Home owns semantic scope/authority.
# Existing cc-auto-fire.yml already refreshes Chief of Staff after OWNER RECONCILED.
# This workflow closes the transient-state gap: a meaningful terminal or
# reconciliation receipt updates the row immediately.
#
# CF-OUTCOME-LOOP-LEAN-01: narrowed from firing on every BUILD FIRED / DONE
# / ACCEPT / CORRECT / PR event to meaningful terminal/reconciliation
# receipts only (issue #193's "semantic refresh fires too often" finding).
# The `pull_request` trigger was dropped as redundant with this: a merge's
# projection refresh already runs from OWNER's own `OWNER RECONCILED:`
# receipt via cc-auto-fire.yml, and a bare PR open/close carries no
# attention-relevant semantic change of its own.

on:
  issues:
    types: [opened, closed]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: cf-cos-semantic-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recognise meaningful Cal Finance state change
        id: event
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
        run: |
          set -euo pipefail
          echo "recognized=false" >> "$GITHUB_OUTPUT"

          case "$EVENT_NAME" in
            issues)
              if [ "$EVENT_ACTION" = "opened" ] || [ "$EVENT_ACTION" = "closed" ]; then
                echo "recognized=true" >> "$GITHUB_OUTPUT"
                echo "number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
                echo "url=$ISSUE_URL" >> "$GITHUB_OUTPUT"
                echo "detail=Cal Finance issue #${ISSUE_NUMBER} ${EVENT_ACTION}: ${ISSUE_TITLE}" >> "$GITHUB_OUTPUT"
              fi
              ;;
            issue_comment)
              # CF-OUTCOME-LOOP-LEAN-01: meaningful terminal/reconciliation
              # receipts only. 'BUILD FIRED:'/'REVIEW FIRED:' are mid-cycle
              # attempt-start receipts, not terminal outcomes, and 'CORRECT'
              # is a bounded in-scope correction request, not a semantic
              # state change — none of the three change NEED ME?/attention,
              # so they no longer trigger a refresh.
              TRIMMED=$(printf '%s' "$COMMENT_BODY" | sed -e '/[^[:space:]]/,$!d' -e 's/^[[:space:]]*//')
              FIRST_LINE=$(printf '%s\n' "$TRIMMED" | head -n 1 | sed -e 's/[[:space:]]*$//')
              case "$FIRST_LINE" in
                'DONE:'*|\
                'ACCEPT'|'ACCEPT '*|'ACCEPT:'*|\
                'BLOCKED:'*|'STOP:'*|'RECONCILIATION REQUIRED:'*|'CALVIN REQUIRED:'*)
                  echo "recognized=true" >> "$GITHUB_OUTPUT"
                  echo "number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
                  echo "url=$COMMENT_URL" >> "$GITHUB_OUTPUT"
                  echo "detail=Cal Finance semantic receipt on item #${ISSUE_NUMBER}: ${FIRST_LINE}" >> "$GITHUB_OUTPUT"
                  ;;
                'OWNER RECONCILED:'*)
                  # Existing cc-auto-fire.yml owns this post-reconciliation refresh.
                  ;;
              esac
              ;;
          esac

      - name: Refresh only the Cal Finance Chief of Staff row
        if: steps.event.outputs.recognized == 'true'
        env:
          WATCH_FIRE_URL: ${{ secrets.WATCH_FIRE_URL }}
          WATCH_FIRE_TOKEN: ${{ secrets.WATCH_FIRE_TOKEN }}
          TARGET_NUMBER: ${{ steps.event.outputs.number }}
          TARGET_URL: ${{ steps.event.outputs.url }}
          EVENT_DETAIL: ${{ steps.event.outputs.detail }}
        run: |
          set -euo pipefail

          # CF-OUTCOME-LOOP-LEAN-01: this is a WATCH/projection refresh
          # only. It must never fall back to BUILD_FIRE_URL — that routed a
          # projection action to the BUILD routine, one of the observed
          # outcome-loop holes. If WATCH's own secrets are absent, fail
          # cleanly instead.
          FIRE_URL="${WATCH_FIRE_URL:-}"
          FIRE_TOKEN="${WATCH_FIRE_TOKEN:-}"
          if [ -z "$FIRE_URL" ] || [ -z "$FIRE_TOKEN" ]; then
            echo "::error::WATCH_FIRE_URL or WATCH_FIRE_TOKEN secret is missing; not falling back to another routine's fire endpoint."
            exit 1
          fi

          PROMPT=$(cat <<EOF
          Projection refresh only for Cal Finance.

          Semantic event: ${EVENT_DETAIL}
          Native item: ${TARGET_URL}

          Read the exact current native item plus Cal Finance Project Home. Refresh ONLY the Cal Finance row in CHIEF OF STAFF and read it back.

          CHIEF OF STAFF RENDER CONTRACT — NON-NEGOTIABLE:
          The PROJECTS table has exactly five columns:
          PROJECT | STATE | NEED ME? | VERIFIED | NOW

          Removed columns are forbidden: ON, LAST VERIFIED, NOW → NEXT.
          History, audit trails, hashes, multi-event summaries and explanatory paragraphs belong in Project Home/GitHub, never this dashboard.

          Candidate row must satisfy every assertion BEFORE any Notion write:
          1. PROJECT = existing Cal Finance project mention/name only.
          2. STATE = one line, max 24 characters.
          3. NEED ME? = exactly YES or NO.
          4. VERIFIED = local Singapore clock only, format h:mm AM/PM, max 8 characters. No links, prose or dates.
          5. NOW = one line, max 80 characters. State only the single current action/blocker. No history, no NEXT list, no links, no hashes, no newline.
          6. Total row is exactly one physical table row. No cell may contain a paragraph, list, line break, or stacked events.

          Validation rule: if any assertion fails, shorten/normalize the candidate before writing. Never preserve or recreate the old verbose six-column shape.

          ATTENTION CONTRACT — COPY, DO NOT INTERPRET:
          - Native GitHub state is the sole attention authority for Cal Finance current status/attention (Phase 2 cutover, issue #231/#235; see docs/CURRENT-AUTHORITY.md) — never Cal Finance Project Home's `NEXT MOVE` line, which is superseded/pointer-only for this fact type.
          - NEEDS CALVIN = the most recent unanswered `CALVIN REQUIRED:` / `STOP:` / `BLOCKED:` / `DONE: EVIDENCE` terminal comment (these route directly to OWNER per CF-TERMINAL-HANDOFF-REPAIR-01, whether or not `needs-owner-wake` is also present), or an open `CALVIN RULING` question, on any open issue or PR.
          - NEEDS CALVIN non-empty -> STATE gets a red prefix and NEED ME? = YES.
          - NEEDS CALVIN empty (authorised AI work running/dispatchable/recovering, a third party is the real blocker, or Calvin explicitly parked the project) -> STATE gets a green prefix and NEED ME? = NO.
          - If native GitHub state cannot be read or is contradictory, write `STALE / RECONCILIATION REQUIRED` rather than inferring GREEN from silence.
          - Milestone COMPLETE, old NEEDS YOU/YOUR MOVE prose, and Cal Finance Project Home's `NEXT MOVE` line do not decide human attention.
          - Do not dispatch, recover, rerank, create work, modify project contracts, or change Cal Finance Project Home.
          EOF
          )

          REQUEST_BODY=$(jq -n --arg text "$PROMPT" '{text:$text}')
          HTTP_CODE=$(curl -sS -o /tmp/cf_cos_refresh.json -w '%{http_code}' \
            --request POST "$FIRE_URL" \
            --header "Authorization: Bearer $FIRE_TOKEN" \
            --header "anthropic-version: 2023-06-01" \
            --header "anthropic-beta: experimental-cc-routine-2026-04-01" \
            --header "Content-Type: application/json" \
            --data "$REQUEST_BODY") || HTTP_CODE="curl_error"

          if [ "$HTTP_CODE" = "curl_error" ] || [ "$HTTP_CODE" -lt 200 ] 2>/dev/null || [ "$HTTP_CODE" -ge 300 ] 2>/dev/null; then
            echo "::error::Cal Finance Chief of Staff refresh fire failed: HTTP/status ${HTTP_CODE}."
            exit 1
          fi

          SESSION_ID=$(jq -r '.claude_code_session_id // "unknown"' /tmp/cf_cos_refresh.json)
          echo "Cal Finance Chief of Staff semantic refresh fired: ${SESSION_ID}" >> "$GITHUB_STEP_SUMMARY"
