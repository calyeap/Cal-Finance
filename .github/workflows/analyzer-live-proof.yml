name: Analyzer live proof

# RELIABILITY-FIRST CONTRACT
#
# This workflow is intentionally explicit and boring:
#   1. a human/authorized operator supplies the exact ref to prove;
#   2. the workflow checks out that exact ref;
#   3. the product's automatic ticker -> report path runs;
#   4. the deterministic acceptance probe decides PASS/FAIL;
#   5. GitHub Actions itself is the receipt.
#
# No PR-label wake, OWNER relay, recursive workflow event, retry controller,
# or label cleanup belongs on this critical path. Autonomy can be re-earned
# later only if this explicit path becomes repetitive and remains reliable.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Exact commit SHA or ref to prove"
        required: true
      ticker:
        description: "Ticker to prove (MSFT, NVDA, or COST); leave blank to run all"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  live-proof:
    name: exact-head RM-brief acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: calboard_proof
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/calboard_proof
      SEC_USER_AGENT: "Cal-Finance-Analyzer-Proof/1.0 (calvinyeap.h@gmail.com)"

    defaults:
      run:
        # Fail the step when the acceptance command fails even though output is
        # piped through tee. A green job must mean the report passed acceptance.
        shell: bash --noprofile --norc -eo pipefail {0}

    steps:
      - name: Checkout exact proof ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Apply migrations
        run: npm run migrate

      - name: Verify reliability-first acceptance probe exists
        run: test -f scripts/analyzer/acceptance-run.ts

      - name: Fresh automatic acceptance — MSFT
        if: ${{ inputs.ticker == '' || inputs.ticker == 'MSFT' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx scripts/analyzer/acceptance-run.ts MSFT | tee msft-acceptance-proof.txt

      - name: Fresh automatic acceptance — NVDA
        if: ${{ inputs.ticker == '' || inputs.ticker == 'NVDA' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx scripts/analyzer/acceptance-run.ts NVDA | tee nvda-acceptance-proof.txt

      - name: Fresh automatic acceptance — COST
        if: ${{ inputs.ticker == '' || inputs.ticker == 'COST' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx scripts/analyzer/acceptance-run.ts COST | tee cost-acceptance-proof.txt

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-live-proof
          path: |
            msft-acceptance-proof.txt
            nvda-acceptance-proof.txt
            cost-acceptance-proof.txt
          if-no-files-found: warn
          retention-days: 90
