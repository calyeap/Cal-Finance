name: Analyzer live proof

# Manual only. Proves the exact requested ref/commit against a real Anthropic key
# stored only as a GitHub Actions secret. This workflow is intentionally not wired
# into normal CI and creates no recurring spend.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or ref to prove (for example PR head SHA)"
        required: false
        default: "master"
      ticker:
        description: "Ticker to prove (MSFT, NVDA, or COST); leave blank to run all"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  live-proof:
    name: fresh live run proof
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: calboard_proof
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/calboard_proof
      # Required by lib/analyzer/acquisition/secClient.ts for EDGAR acquisition.
      # Not a secret — an identifying contact string EDGAR's own terms require.
      SEC_USER_AGENT: "Cal-Finance-Analyzer-Proof/1.0 (calvinyeap.h@gmail.com)"

    defaults:
      run:
        # Without pipefail, `cmd | tee file` always exits 0 (tee's status),
        # so a failing ai-run would be masked as a passing step.
        shell: bash --noprofile --norc -eo pipefail {0}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Apply migrations
        run: npm run migrate

      - name: Fresh live run — MSFT
        if: ${{ inputs.ticker == '' || inputs.ticker == 'MSFT' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run ai-run -- MSFT --slots | tee msft-fresh-run-proof.txt

      - name: Fresh live run — NVDA
        if: ${{ inputs.ticker == '' || inputs.ticker == 'NVDA' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run ai-run -- NVDA --slots | tee nvda-fresh-run-proof.txt

      - name: Fresh live run — COST
        if: ${{ inputs.ticker == '' || inputs.ticker == 'COST' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run ai-run -- COST --slots | tee cost-fresh-run-proof.txt

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-live-proof
          path: |
            msft-fresh-run-proof.txt
            nvda-fresh-run-proof.txt
            cost-fresh-run-proof.txt
          if-no-files-found: warn
          retention-days: 90
